name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Read-only: @claude answers and comments, never commits
      pull-requests: write   # Post inline review comments
      issues: write          # Update issue/PR comments
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          track_progress: true
          display_report: true
          include_fix_links: false

          # EXPERIMENT (revert after): surface the full SDK stream so a triggered
          # run prints every tool call and permission denial by name. The action
          # otherwise hides it ("full output hidden for security"), which is why
          # the fan-out denials were only ever a count, never a tool list.
          show_full_output: true

          # Grant the built-in GitHub MCP servers' read/search/CI tools, the
          # inline-comment tool, and `gh api` for read-only GitHub access. These
          # ADD to the action's defaults (Edit/Write/git stay available), but
          # `contents: read` above is what keeps this workflow from committing.
          #
          # EXPERIMENT (revert after): `Task` is added to test the fan-out
          # hypothesis. The /code-review plugin — and any explicit "fan out"
          # instruction — spawns subagents via the Task tool, which is NOT in
          # tag mode's fixed allow-set; under acceptEdits + headless (no prompt
          # handler) an un-listed tool is silently denied. If granting Task lets
          # subagents spawn and run, Task-denial was the fan-out blocker.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Task,mcp__github__get_*,mcp__github__list_*,mcp__github__search_*,mcp__github_ci__*,mcp__github_inline_comment__*,Bash(gh api *)"
