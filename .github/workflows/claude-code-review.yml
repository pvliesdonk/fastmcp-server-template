name: Claude Code Review

on:
  pull_request:
    # No branches filter here (unlike the rendered .jinja twin): this repo's
    # template-ci runs on all PRs, so the wait-for-ci poll always finds a run.
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  wait-for-ci:
    # Skip PRs from forks: GitHub does not expose repository secrets
    # (including CLAUDE_CODE_OAUTH_TOKEN) to workflows running in fork-PR
    # context, regardless of maintainer approval. Running anyway produces
    # a hard-failing check on every external contribution.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      ci_passed: ${{ steps.wait.outputs.ci_passed }}
    steps:
      - name: Wait for CI to conclude on this PR head
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Gate the review on the CI workflow: only review code the gate
          # accepted. Poll the CI run for THIS PR head SHA (not github.sha,
          # which is the merge commit) until it completes; tolerate the
          # not-yet-created race by looping. Gate on the run *conclusion*
          # so CI's continue-on-error 3.14 matrix job never blocks.
          deadline=$(( SECONDS + 25 * 60 ))
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs=$(gh api "repos/${REPO}/actions/workflows/template-ci.yml/runs?head_sha=${HEAD_SHA}&per_page=1" 2>/dev/null || echo '{}')
            status=$(echo "$runs" | jq -r '.workflow_runs[0].status // empty')
            conclusion=$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // empty')
            if [ "$status" = "completed" ]; then
              break
            fi
            echo "CI status: ${status:-not-found-yet}; waiting 20s..."
            sleep 20
          done
          if [ "$conclusion" = "success" ]; then
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
            echo "CI passed — review will run."
          else
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
            echo "CI did not pass (conclusion=${conclusion:-timeout}) — skipping review."
          fi

  claude-review:
    needs: wait-for-ci
    if: ${{ needs.wait-for-ci.outputs.ci_passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Reviewer reads code; it must never commit
      pull-requests: write     # Post inline review comments
      issues: read
      id-token: write
      actions: read            # Read CI results instead of re-running them
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # NB: unlike the rendered .jinja twin, this repo's own reviewer has NO uv
      # env — the template has no root pyproject.toml (its Python lives in
      # scripts/ and runs via `uv run --no-project`), so `uv sync` would fail.
      # This reviewer reviews template files and reads template-ci results via
      # `gh run view` rather than re-running a gate.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Single-agent review — NOT the /code-review plugin. The plugin fans
          # out into parallel review agents dispatched as background tasks that
          # the headless action drops before they finish, so reviews complete
          # green and post nothing (claude-code-action#1499 / #1087 / #1523,
          # claude-code#85275 — all silent). A single-agent prompt does the
          # review inline and posts reliably. Revert to the plugin once those
          # are fixed upstream.
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} DIRECTLY in this session.
            Do NOT launch subagents, the Task/Agent tool, or the /code-review skill — a single-agent review is required (background subagents are silently dropped in this headless CI, so a fan-out review posts nothing).

            1. Get the diff with `gh pr diff` (base branch is origin/main); read changed files with Read/Grep for context as needed.
            2. Flag ONLY high-signal issues in the changed code:
               - will fail to compile/parse (syntax/type errors, missing imports, unresolved references);
               - will definitely produce wrong results regardless of input (clear logic errors);
               - a security problem introduced by the diff;
               - a clear, quotable violation of a CLAUDE.md rule (consider only CLAUDE.md files at or above the changed file's path).
               Do NOT flag: style/quality opinions, speculative or input-dependent concerns, pre-existing issues, linter-catchable nits, or anything you cannot verify from the diff plus a quick read. False positives erode trust — when unsure, drop it.
            3. Post each issue as an inline comment via `mcp__github_inline_comment__create_inline_comment` (confirmed: true) on the exact line(s); include a ```suggestion block only for a small self-contained fix that fully resolves the issue. One comment per issue, no duplicates.
            4. Update your tracking comment with a short summary: list each issue, or if none, state "No issues found. Checked for bugs and CLAUDE.md compliance."
          # Surface progress so a silent failure is visible.
          track_progress: true
          display_report: true
          include_fix_links: false
          # Read CI results through the built-in GitHub CI MCP server.
          additional_permissions: |
            actions: read
          # Grant the built-in GitHub read/search MCP tools, the CI tools, the
          # inline-comment tool (what lets the reviewer post inline — not in the
          # default allow-set), `gh api` for read-only API access, and the gh
          # pr/run read commands. contents: read above keeps the reviewer from
          # committing — it only reads and comments. No `uv run` here (no root
          # pyproject to sync); the .jinja twin adds the uv-investigation tools
          # for generated projects. No Task/Agent: this reviewer is deliberately
          # single-agent (see the prompt note above).
          claude_args: |
            --allowedTools "Skill,mcp__github__get_*,mcp__github__list_*,mcp__github__search_*,mcp__github_ci__*,mcp__github_inline_comment__*,Bash(gh api *),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh run list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
