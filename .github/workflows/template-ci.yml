name: template-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render-and-gate:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.6"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Render smoke project with copier
        # --vcs-ref=HEAD is not optional here; every render step in this file
        # carries it. See the `clean-tree opt-out render` step below for why,
        # and why removing it from one step alone breaks the job locally.
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke

      - name: Idempotence check (second render is byte-identical)
        # Runs BEFORE the gate so the first render is still pristine.
        # ``uv sync``/``ruff``/``mypy``/``pytest`` would otherwise add
        # .venv, uv.lock, .mypy_cache etc. that the second (untouched)
        # render doesn't have.
        #
        # This render and the one above must stay pinned to the SAME ref.
        # Pinning one and not the other makes them render different templates
        # in a tag-bearing clone, and this diff then reports an idempotence
        # failure that does not exist.
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke2
          if ! diff -r /tmp/smoke /tmp/smoke2 > /tmp/smoke-diff 2>&1; then
            echo "::error::second render differs from first — template is not idempotent"
            cat /tmp/smoke-diff
            exit 1
          fi

      - name: structural gate toggle-off render
        # The smoke project rendered in the first step has the gate ON, so the
        # install/lint/test steps that follow exercise the gate's artifacts and
        # its own test suite. This step renders a SECOND project with the gate
        # OFF and asserts every gated artifact is absent — the generated suite
        # cannot cover this (test_structural_gate.py does not render when the
        # gate is off), so a jinja edit that leaks an artifact past its
        # {% raw %}{% if %}{% endraw %} guard would otherwise pass CI silently.
        # One assertion per independently-gated block (pyproject has two: the
        # mccabe/pylint thresholds AND the tests/** S-ignore).
        run: |
          rm -rf /tmp/smoke-gate-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data enable_structural_gate=false \
            . /tmp/smoke-gate-off
          cd /tmp/smoke-gate-off
          test ! -f tests/test_structural_gate.py \
            || { echo "::error::structural test rendered with gate off"; exit 1; }
          test ! -f tests/.jinja \
            || { echo "::error::conditional filename left a stray tests/.jinja"; exit 1; }
          ! grep -q 'structural-diff-gate' .pre-commit-config.yaml \
            || { echo "::error::pre-push hook rendered with gate off"; exit 1; }
          ! grep -q 'default_install_hook_types' .pre-commit-config.yaml \
            || { echo "::error::default_install_hook_types rendered with gate off"; exit 1; }
          ! grep -qE '^  structure:' .github/workflows/ci.yml \
            || { echo "::error::structure CI job rendered with gate off"; exit 1; }
          ! grep -q 'tool.ruff.lint.mccabe' pyproject.toml \
            || { echo "::error::structural thresholds rendered with gate off"; exit 1; }
          ! grep -qF '"tests/**"' pyproject.toml \
            || { echo "::error::structural tests/** S-ignore rendered with gate off"; exit 1; }
          ! grep -q '## Structural health' CLAUDE.md \
            || { echo "::error::structural-health section rendered with gate off"; exit 1; }
          ! grep -qF 'Structural quality (diff) passes' CLAUDE.md \
            || { echo "::error::structural acceptance-gate item rendered with gate off"; exit 1; }

      - name: authorization toggle-off render
        # Rendered for the Vale gate far below, but rendered HERE, beside its
        # sibling variants and before anything writes into a tree, so it passes
        # through the render-hygiene step like every other variant. Moving it
        # down to its consumer would put it after `uv sync` and after the gate's
        # own pack copy, where hygiene can no longer be checked at all.
        #
        # Chosen for what it changes in the LINTED set. Not the gate-off render
        # above: enable_structural_gate toggles nothing under docs/ or
        # README.md, so that variant's prose is byte-identical to /tmp/smoke.
        # enable_authorization is the flag that matters — off, it drops
        # docs/guides/authorization.md entirely and changes both README.md and
        # docs/guides/authentication.md, so its prose is a branch no other step
        # sees.
        run: |
          rm -rf /tmp/smoke-authz-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data enable_authorization=false \
            . /tmp/smoke-authz-off

      - name: clean-tree opt-out render
        # Split out from the assertion step below and placed here for the same
        # reason as the authorization render above: a variant rendered after the
        # hygiene gate is a branch that gate never sees. The opt-out is a
        # {%- if %} trim inside tests/test_structural_gate.py, which is exactly
        # the "Jinja tag in one branch of a conditional" class of #251.
        #
        # --vcs-ref=HEAD renders the working-tree commit — the canonical
        # explanation for every render step in this file. Without it copier
        # defaults to the latest git tag, which predates this step's variable: a
        # clone that HAS tags (a normal local checkout) then renders the old
        # template, ignores the --data, and the assertions below break. CI's
        # default checkout fetches no tags, so copier falls through to HEAD and
        # they pass even unpinned — i.e. an omitted pin slips through CI and
        # breaks only on a local full clone.
        #
        # EVERY render step here carries the pin for that reason; they are not
        # independent choices. The Vale gate forced the issue: it lints rendered
        # PROSE, so in a tag-bearing clone it reported 19 errors against docs the
        # merged tree had already fixed, blaming the working tree for the last
        # release's text. The assertion-only steps failed less loudly but the
        # same way. Pin them together or the job means something different
        # locally than it does in CI.
        #
        # The smoke/smoke2 idempotence pair in particular must stay pinned
        # TOGETHER: pinning one and not the other makes them render different
        # templates in a tag-bearing clone, and the diff reports a template
        # idempotence failure that does not exist.
        #
        # Only the OPT-OUT variant is rendered. The flag-true render used to be
        # done here as /tmp/smoke-cleantree-on with an invocation identical to
        # the first render step's — same answers file, same --defaults, no
        # --data override, because structural_gate_assert_clean_tree is absent
        # from smoke-answers.yml and defaults to true. That made it a
        # byte-identical copy of /tmp/smoke, which the idempotence check
        # already proves cannot differ, at the cost of a sixth full copier
        # render per matrix leg — each running _tasks, including vendor_spa.py's
        # network download. /tmp/smoke IS the flag-true render; the assertions
        # below use it directly.
        run: |
          rm -rf /tmp/smoke-cleantree-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data structural_gate_assert_clean_tree=false \
            . /tmp/smoke-cleantree-off

      - name: render hygiene (pristine render already satisfies the shipped hooks)
        # The template ships `trailing-whitespace` and `end-of-file-fixer`
        # (.pre-commit-config.yaml.jinja). Both REWRITE files, so anything they
        # would touch in a pristine render is a latent `copier update` conflict:
        # the downstream commits the fixed-up form, so copier's 3-way merge sees
        # `ours` != `base` in that region, and the first template version that
        # also changes that region conflicts for EVERY downstream.
        #
        # Issue #251 is the real instance — ci.yml.jinja used to end with the
        # endif closing the structural-gate block, and Jinja (no trim_blocks)
        # keeps the newline after a block tag, so the render ended with a blank
        # line. end-of-file-fixer stripped it downstream; the v2.11.0
        # `ci-success` job then appended to that exact tail and every
        # downstream's ci.yml conflicted. Latent for months because nothing had
        # touched ci.yml's tail before.
        #
        # Runs BEFORE `uv sync` so the render is still pristine, and covers
        # EVERY rendered variant — a Jinja tag at EOF only appears in one branch
        # of a conditional, so checking a single variant would miss it. Any new
        # render step belongs above this one and in the argument list below;
        # a variant rendered further down is a branch this guard never sees.
        # /tmp/smoke2 is excluded deliberately: the idempotence step already
        # asserts it is byte-identical to /tmp/smoke, so checking it again
        # could not fail independently.
        run: |
          python3 scripts/check_render_hygiene.py \
            /tmp/smoke /tmp/smoke-gate-off /tmp/smoke-authz-off \
            /tmp/smoke-cleantree-off

      - name: structural gate clean-tree assertion present (default) / dropped (opt-out)
        # structural_gate_assert_clean_tree gates ONLY the whole-tree clean
        # assertion (test_shipped_code_passes_…): default true keeps it; false
        # drops it so a brownfield repo with pre-existing structural debt can
        # adopt the gate while the diff-scoped gate, pre-push hook, CI 'structure'
        # job, and behavioural tests all remain. A test cannot assert its own
        # absence, and a missing test passes pytest vacuously, so assert the
        # rendered file directly — BOTH halves: present under the default render,
        # absent under the opt-out (an inverted condition would otherwise drop the
        # self-check from every downstream and still go green). The two renders
        # it asserts over are produced by the `clean-tree toggle renders` step
        # above, which is also where the --vcs-ref=HEAD rationale lives.
        #
        # Both rendered variants of the gate's own test file are then linted: the
        # opt-out trim must leave no unused import, and the jinja if/endif
        # whitespace seam must stay format-clean in both the present and absent
        # branches.
        run: |
          grep -q 'def test_shipped_code_passes_the_structural_overlay_cleanly' /tmp/smoke/tests/test_structural_gate.py \
            || { echo "::error::clean-tree assertion missing from the default render"; exit 1; }
          # opt-out render (flag false): the whole-tree self-check MUST be dropped,
          # everything else MUST remain.
          off=/tmp/smoke-cleantree-off
          test -f "$off/tests/test_structural_gate.py" \
            || { echo "::error::structural test file missing — gate should still render"; exit 1; }
          ! grep -q 'def test_shipped_code_passes_the_structural_overlay_cleanly' "$off/tests/test_structural_gate.py" \
            || { echo "::error::clean-tree assertion rendered despite opt-out"; exit 1; }
          grep -q 'def test_options_reach_ruff_and_gate_is_diff_scoped' "$off/tests/test_structural_gate.py" \
            || { echo "::error::diff-scope behavioural test dropped by clean-tree opt-out"; exit 1; }
          grep -q 'structural-diff-gate' "$off/.pre-commit-config.yaml" \
            || { echo "::error::pre-push hook dropped by clean-tree opt-out"; exit 1; }
          grep -qE '^  structure:' "$off/.github/workflows/ci.yml" \
            || { echo "::error::structure CI job dropped by clean-tree opt-out"; exit 1; }
          # both branches of the conditional must lint + format clean (catches an
          # unused import left by the trim and any if/endif whitespace regression).
          for d in /tmp/smoke /tmp/smoke-cleantree-off; do
            ( cd "$d" \
              && uv run --no-project --with ruff ruff check --config pyproject.toml tests/test_structural_gate.py \
              && uv run --no-project --with ruff ruff format --check --config pyproject.toml tests/test_structural_gate.py ) \
              || { echo "::error::rendered structural test ($d) is not lint/format-clean"; exit 1; }
          done

      - name: Install rendered project
        working-directory: /tmp/smoke
        run: uv sync --all-extras --all-groups

      - name: Assert MCP Apps SPA was vendored
        working-directory: /tmp/smoke
        run: |
          test -f src/smoke_mcp/static/app.html
          uv run python scripts/vendor_spa.py --check

      - name: ruff check
        working-directory: /tmp/smoke
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: /tmp/smoke
        run: uv run ruff format --check .

      - name: mypy
        working-directory: /tmp/smoke
        run: uv run mypy src/ tests/

      - name: pytest
        working-directory: /tmp/smoke
        run: uv run pytest -x -q

      - name: CLAUDE.md sentinel structure
        working-directory: /tmp/smoke
        run: |
          # Line-anchored regexes so prose mentions don't satisfy the check.
          # Count assertions so a dropped inner DOMAIN-START/END pair fails
          # loudly — copier's 3-way merge needs all fences intact.
          # `|| true` keeps bash -e from aborting at the command substitution when
          # grep finds zero matches (exit 1), so the ::error:: lines below fire
          # instead of an opaque "exit 1" without context.
          start=$(grep -cE '^<!-- DOMAIN-START -->$' CLAUDE.md || true)
          end=$(grep -cE '^<!-- DOMAIN-END -->$' CLAUDE.md || true)
          [ "$start" = "3" ] || { echo "::error::expected 3 DOMAIN-START fences, found $start"; exit 1; }
          [ "$end" = "3" ] || { echo "::error::expected 3 DOMAIN-END fences, found $end"; exit 1; }
          grep -qE '^<!-- ===== TEMPLATE-OWNED SECTIONS BELOW' CLAUDE.md || { echo "::error::missing TEMPLATE-OWNED opening fence"; exit 1; }
          grep -qE '^<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->$' CLAUDE.md || { echo "::error::missing TEMPLATE-OWNED closing fence"; exit 1; }
          # TEMPLATE-TRACKING marker pairs (2): one around the bot-reviewer
          # paragraph, one around Shared Infrastructure + Contributing fixes
          # upstream. FORKING.md's detach scrub deletes them as a sed range — a
          # dropped marker would make the scrub delete the wrong span, so the
          # count must stay exact.
          ttstart=$(grep -cE '^<!-- TEMPLATE-TRACKING-START -->$' CLAUDE.md || true)
          ttend=$(grep -cE '^<!-- TEMPLATE-TRACKING-END -->$' CLAUDE.md || true)
          [ "$ttstart" = "2" ] || { echo "::error::expected 2 TEMPLATE-TRACKING-START markers, found $ttstart"; exit 1; }
          [ "$ttend" = "2" ] || { echo "::error::expected 2 TEMPLATE-TRACKING-END markers, found $ttend"; exit 1; }

      - name: shared docs render with consumer env_prefix
        working-directory: /tmp/smoke
        run: |
          # Smoke answers set env_prefix=SMOKE_MCP — rendered docs
          # should name some consumer-prefixed env var, never the placeholder.
          # Negative check uses a word-boundary regex so legitimate
          # rendered tokens like SMOKE_MCP_SERVER_NAME don't false-positive
          # as MCP_SERVER_ leaks (substring collision).
          for f in \
              docs/deployment/oidc.md \
              docs/deployment/docker.md \
              docs/guides/authentication.md; do
            grep -qE 'SMOKE_MCP_[A-Z][A-Z0-9_]*' "$f" \
              || { echo "::error::$f missing any SMOKE_MCP_ env var — substitution did not occur"; exit 1; }
          done
          ! grep -lE '(^|[^A-Z0-9_])MCP_SERVER_' \
              docs/deployment/docker.md \
              docs/deployment/oidc.md \
              docs/guides/authentication.md \
            || { echo "::error::MCP_SERVER_ placeholder literal leaked into shared docs"; exit 1; }
          ! grep -lF fastmcp-server-template \
              docs/deployment/docker.md \
              docs/deployment/oidc.md \
              docs/guides/authentication.md \
            || { echo "::error::fastmcp-server-template literal leaked into shared docs"; exit 1; }

      - name: Dockerfile sentinel structure
        working-directory: /tmp/smoke
        run: |
          for marker in \
            "# DOCKERFILE-STATE-DIRS-START" \
            "# DOCKERFILE-STATE-DIRS-END" \
            "# DOCKERFILE-VOLUMES-START" \
            "# DOCKERFILE-VOLUMES-END"; do
            # `|| true` keeps bash -e from aborting at the command substitution when
            # grep finds zero matches (exit 1), so the ::error:: line below fires instead
            # of an opaque "exit 1" without context.
            count=$(grep -cF "$marker" Dockerfile || true)
            [ "$count" = "1" ] || { echo "::error::expected 1 '$marker' sentinel, found $count"; exit 1; }
          done

      - name: release.yml marketplace upsert
        working-directory: /tmp/smoke
        run: |
          # Regression guard: upsert block must survive template renders.
          grep -qF '"git-subdir"' .github/workflows/release.yml \
            || { echo "::error::release.yml missing git-subdir marker — upsert regressed"; exit 1; }
          grep -qF '".claude-plugin/plugin"' .github/workflows/release.yml \
            || { echo "::error::release.yml missing .claude-plugin/plugin path — upsert regressed"; exit 1; }
          grep -qF 'any(.[]; .name == $name)' .github/workflows/release.yml \
            || { echo "::error::release.yml missing upsert branch — still silently no-ops on missing entry"; exit 1; }

      - name: vale config structural check
        working-directory: /tmp/smoke
        run: |
          # Cheap sanity check on the rendered .vale.ini — catches
          # template breakage (empty file, missing Packages directive)
          # without paying the cost of a full vale sync+lint round.
          [ -f .vale.ini ] || { echo "::error::.vale.ini missing — render regressed"; exit 1; }
          grep -qE '^StylesPath\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing StylesPath directive"; exit 1; }
          grep -qE '^Packages\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing Packages directive"; exit 1; }
          grep -qE '^\[\*\.md\]$' .vale.ini \
            || { echo "::error::.vale.ini missing [*.md] section"; exit 1; }
          grep -qE '^BasedOnStyles\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing BasedOnStyles directive"; exit 1; }

      - name: vale version pin lockstep
        working-directory: /tmp/smoke
        run: |
          # CI's vale-cli/vale-action `version:` and pre-commit's vale hook
          # `rev:` must stay in lockstep — drift means local pre-commit and
          # CI exercise different Vale binaries, so a finding visible to one
          # becomes silent to the other. Same discipline as the nfpm
          # lockstep enforced in PR #66.
          #
          # CI_VER extraction is scoped to the `vale:` job to avoid
          # accidentally matching a `version: "X.Y.Z"` if some other job
          # (e.g. setup-uv) ever moves off `version: "latest"` to a pinned
          # semver — that would silently extract the wrong pin and let real
          # drift slip through.
          CI_VER=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+version:/{print; exit}' .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          PC_VER=$(awk '/^[[:space:]]*-[[:space:]]*repo:.*vale-cli\/vale[[:space:]]*$/{f=1; next} f && /rev:/{print; exit}' .pre-commit-config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          [ -n "$CI_VER" ] || { echo "::error::vale version pin not found in rendered ci.yml"; exit 1; }
          [ -n "$PC_VER" ] || { echo "::error::vale rev not found in rendered .pre-commit-config.yaml"; exit 1; }
          [ "$CI_VER" = "$PC_VER" ] \
            || { echo "::error::vale version drift — ci.yml=$CI_VER pre-commit=$PC_VER (bump in lockstep)"; exit 1; }

      - name: vale exclusion-scope lockstep
        working-directory: /tmp/smoke
        run: |
          # CI's vale_flags glob and pre-commit's exclude regex must scope to
          # the same subtrees. Drift means CI and pre-commit lint different file
          # sets — a finding visible to one is silent to the other.
          #
          # The two use different syntaxes for the same intent: the CI glob lists
          # subtrees as `{a,b,c}` (brace alternation, since Vale honors only one
          # --glob), while the pre-commit exclude is a regex `(a|b|c)`. So we
          # canonicalize each to a sorted set of subtree names under docs/ and
          # compare the sets, not the raw strings.
          #
          # CI extraction is scoped to the vale: job (same awk anchor as the
          # version check above) to avoid false matches on other vale_flags
          # values if a downstream adds a second Vale invocation.
          CI_EXCL=$(awk '/^  vale:/{f=1} f && /vale_flags:/{print; exit}' .github/workflows/ci.yml \
            | grep -oE '!docs/[^"'"'"' ]*' || true)
          # grep -A15 bounds the search to the vale hook block. The `$`
          # anchor avoids matching `- id: vale-sync`. Window of 15 safely
          # covers the 11-line gap between `- id: vale` and `exclude:` in the
          # rendered pre-commit config; prevents capturing a later hook's
          # exclude if the vale hook's own exclude is removed.
          PC_EXCL=$(grep -A15 '^[[:space:]]*- id: vale$' .pre-commit-config.yaml \
            | grep -m1 'exclude:' \
            | grep -oE 'docs/[^[:space:]]*' || true)
          [ -n "$CI_EXCL" ] || { echo "::error::vale exclusion glob not found in ci.yml vale_flags"; exit 1; }
          [ -n "$PC_EXCL" ] || { echo "::error::vale exclude not found in .pre-commit-config.yaml vale hook"; exit 1; }
          # Canonicalize to a sorted, comma-separated set of subtree names:
          # strip a leading ! / ^, the docs/ prefix, and a trailing /** or /;
          # drop {}/() grouping; split on , or | ; sort. Handles both a single
          # subtree (docs/superpowers) and a multi-subtree set identically.
          canon() {
            echo "$1" \
              | sed -E 's|^!||; s|^\^||; s|^docs/||; s|/\*\*$||; s|/$||' \
              | tr -d '{}()' \
              | tr '|,' '\n' \
              | sort | paste -sd, -
          }
          CI_NORM=$(canon "$CI_EXCL")
          PC_NORM=$(canon "$PC_EXCL")
          [ "$CI_NORM" = "$PC_NORM" ] \
            || { echo "::error::vale exclusion scope drift — ci.yml=$CI_EXCL ($CI_NORM) pre-commit=$PC_EXCL ($PC_NORM)"; exit 1; }

      - name: vale pack-list lockstep
        # Same family as the two lockstep steps above, one surface further out.
        # `.vale.ini`'s `Packages =` is the source of truth for WHICH style
        # packs exist. Three other places enumerate them, and none can derive
        # the list at runtime:
        #
        #   1. the rendered ci.yml's `Cache Vale style packages` path: —
        #      actions/cache takes no shell variable, so the list must stay
        #      literal, and it is what every downstream runs
        #   2. the rendered .pre-commit-config.yaml's `vale-sync` hook, which
        #      tests each pack directory to decide whether to sync
        #   3. `.vale.ini`'s own BasedOnStyles
        #
        # Nothing failed loudly when they diverged. Adding another pack to
        # `Packages` alone leaves the downstream cache list stale; leaves the
        # pre-commit hook blind to it, so a downstream's local `vale` run breaks
        # with no sync; and — if BasedOnStyles names a pack `Packages` never
        # fetches — makes vale exit `E100 [loadStyles]`, which the gate below
        # reports as "rendered prose must be clean": exactly the
        # packs-versus-prose misdiagnosis its `vale sync` guard exists to
        # prevent.
        #
        # So derive the set and assert all three enumerations equal it. The gate
        # step consumes the derived list via VALE_PACKS rather than becoming a
        # fourth.
        run: |
          set -euo pipefail
          VALE_INI=/tmp/smoke/.vale.ini
          [ -f "$VALE_INI" ] \
            || { echo "::error::$VALE_INI missing — render regressed"; exit 1; }
          # A Packages entry is either a registry name (`Google`, optionally
          # `Name@1.2.3`) or a URL to a .zip whose basename is the directory
          # `vale sync` creates under StylesPath. Reduce both to that name.
          #
          # Trailing `|| true` on every extraction pipeline below, including
          # this one: a zero-match grep exits 1, and under `pipefail` that
          # status propagates out of the command substitution, so `set -e`
          # would kill the step at the ASSIGNMENT — before the guard written to
          # diagnose exactly that case could print. #159 fixed this same shape
          # in the version-pin step; every extraction here needs it, because
          # "extracted nothing" is the failure these guards exist to name.
          canon_packs() {
            tr ',' '\n' <<<"$1" \
              | sed -E 's#^[[:space:]]+##; s#[[:space:]]+$##; s#^.*/##; s#\.zip$##; s#@.*$##' \
              | grep -v '^$' | sort -u | paste -sd' ' - || true
          }
          PACKS=$(canon_packs "$(sed -nE 's/^Packages[[:space:]]*=[[:space:]]*//p' "$VALE_INI")")
          [ -n "$PACKS" ] \
            || { echo "::error::no Packages entries extractable from the rendered .vale.ini"; exit 1; }

          # BasedOnStyles minus the built-in `Vale` style, which is always
          # available and has no package to fetch.
          BASED=$(canon_packs "$(sed -nE 's/^BasedOnStyles[[:space:]]*=[[:space:]]*//p' "$VALE_INI" \
            | sed -E 's/(^|,)[[:space:]]*Vale[[:space:]]*(,|$)/\1/')")
          [ "$BASED" = "$PACKS" ] \
            || { echo "::error::.vale.ini pack drift — BasedOnStyles=[$BASED] but Packages=[$PACKS]. A style in BasedOnStyles that Packages never fetches makes vale exit E100 [loadStyles]; a fetched pack no style uses is dead weight."; exit 1; }

          # The same enumeration in the RENDERED ci.yml. It drifts identically
          # and nothing else checks it, so a pack change that reaches downstream
          # with a stale cache list would otherwise be invisible here.
          DOWNSTREAM=$(awk '/^      - name: Cache Vale style packages$/{f=1} f && /^ *key:/{exit} f' \
              /tmp/smoke/.github/workflows/ci.yml \
            | grep -oE '^[[:space:]]+\.vale/styles/[A-Za-z0-9._-]+' \
            | sed -E 's#^.*/##' | sort -u | paste -sd' ' - || true)
          [ "$DOWNSTREAM" = "$PACKS" ] \
            || { echo "::error::rendered ci.yml cache path drift — cached=[$DOWNSTREAM] but .vale.ini Packages=[$PACKS]. Update the 'Cache Vale style packages' path: list in ci.yml.jinja."; exit 1; }

          # The rendered pre-commit `vale-sync` hook decides whether to run
          # `vale sync` by testing each pack directory for existence. A pack it
          # does not know about is never seen as missing, so the hook stays
          # quiet and the `vale` hook right after it exits E100 on the
          # downstream's machine — the local mirror of the CI failure above.
          #
          # Anchored at BOTH ends and bounded by the next `- id:`, which is the
          # posture #159 established for the sibling extraction ~100 lines up.
          # Unanchored, `- id: vale-sync` also matches `- id: vale-sync-foo`;
          # unbounded, awk scans to EOF when the loop is reworded and captures
          # a later hook's `for p in`, reporting that hook's list as this one's.
          PRECOMMIT=$(canon_packs "$(awk '
              /^[[:space:]]*-[[:space:]]*id:[[:space:]]*vale-sync[[:space:]]*$/{f=1; next}
              f && /^[[:space:]]*-[[:space:]]*id:/{exit}
              f && /^[[:space:]]*for p in /{print; exit}' \
              /tmp/smoke/.pre-commit-config.yaml \
            | sed -E 's/^[[:space:]]*for p in //; s/;[[:space:]]*do[[:space:]]*$//' | tr ' ' ',')")
          [ "$PRECOMMIT" = "$PACKS" ] \
            || { echo "::error::rendered .pre-commit-config.yaml pack drift — vale-sync hook checks [$PRECOMMIT] but .vale.ini Packages=[$PACKS]. Update the 'for p in ...' list in .pre-commit-config.yaml.jinja."; exit 1; }

          # Single source for the gate step's pack copy.
          echo "VALE_PACKS=$PACKS" >> "$GITHUB_ENV"
          echo "vale packs: $PACKS"

      # NO actions/cache step for the style packs, deliberately. The obvious
      # move is to mirror the rendered ci.yml's `Cache Vale style packages`
      # step, and an earlier revision of this gate did. It does nothing:
      # `vale sync` does not consult a cache, it WIPES and re-creates every
      # directory named in `Packages =` on every invocation. Verified by
      # dropping a canary file into .vale/styles/Google and .vale/styles/
      # ai-tells after a sync and running sync again — both canaries were gone.
      # So a restored cache is discarded before it is ever read, and the step
      # costs an upload and a download to change nothing.
      #
      # The consequence is real and is NOT solved by caching: this gate
      # hard-depends on the pinned tbhb/vale-ai-tells release URL staying live,
      # exactly as .vale.ini.jinja already warns. Making a cache load-bearing
      # means guarding the sync on pack-directory existence the way the
      # vale-sync pre-commit hook does — which trades that resilience against
      # `Packages =`'s deliberate "resolve to the latest registry release on
      # each sync". That is a fleet-wide call affecting the rendered ci.yml
      # too, not something to settle inside this gate.

      - name: vale gate over the render
        # The structural check above proves .vale.ini renders; it has never
        # proved the rendered PROSE is clean. Every prose defect therefore
        # reached a downstream's own vale job first (#270).
        #
        # One matrix leg only: Vale's result does not depend on the Python
        # version, and `vale sync` is a network fetch.
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          # Extract, never restate (#143/#159): duplicated Vale configuration
          # drifts, and a finding visible to one surface goes silent in the
          # other. Same `vale:`-job awk anchor the two lockstep steps use.
          CI_YML=/tmp/smoke/.github/workflows/ci.yml
          # `|| true`: grep exits 1 on no match, and under set -e a failing
          # substitution kills the step before the guard below can say why
          # (#159 fixed this same shape two steps up).
          VER=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+version:/{print; exit}' "$CI_YML" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          FILES_JSON=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+files:/{print; exit}' "$CI_YML" \
            | sed -E "s/^[[:space:]]*files:[[:space:]]*'//; s/'[[:space:]]*$//")
          GLOB=$(awk '/^  vale:/{f=1} f && /vale_flags:/{print; exit}' "$CI_YML" \
            | sed -E 's/^[[:space:]]*vale_flags:[[:space:]]*"//; s/"[[:space:]]*$//')
          # Non-empty assertions matter more than the comparison: a future
          # ci.yml restructure that breaks an anchor would otherwise leave this
          # gate silently linting nothing and still reporting success.
          [ -n "$VER" ]  || { echo "::error::vale version not extractable from rendered ci.yml"; exit 1; }
          [ -n "$GLOB" ] || { echo "::error::vale_flags not extractable from rendered ci.yml"; exit 1; }
          mapfile -t FILES < <(echo "$FILES_JSON" | jq -er '.[]')
          [ "${#FILES[@]}" -gt 0 ] \
            || { echo "::error::vale files list not extractable from rendered ci.yml"; exit 1; }
          # vale_flags is plural: split it so a second flag does not arrive as
          # one argv element, which Vale would read as a path.
          read -ra VALE_FLAGS <<<"$GLOB"
          echo "gating on vale $VER over ${FILES[*]} with ${VALE_FLAGS[*]}"

          # CLAUDE.md's "Making changes" routine spells the same invocation out
          # for a human to paste, and calls itself a convenience copy — which
          # made it a restatement nothing checked, in the one file that also
          # calls itself "the only pre-push path". A stale copy there is the
          # #143 failure exactly: the maintainer's local run lints a narrower
          # set than this gate, so prose passes locally and fails here.
          # Single quotes are the shell quoting a human needs when pasting and
          # are not part of the value, so strip them before comparing.
          CLAUDE_CMD=$(grep -F 'vale --glob=' CLAUDE.md | head -1 \
            | tr -d "'" | sed -E 's/^[[:space:]]*//; s/[[:space:]]+$//' || true)
          [ -n "$CLAUDE_CMD" ] \
            || { echo "::error::no 'vale --glob=' command found in CLAUDE.md — the documented local routine no longer shows one, so it cannot be checked against this gate"; exit 1; }
          [ "$CLAUDE_CMD" = "vale ${VALE_FLAGS[*]} ${FILES[*]}" ] \
            || { echo "::error::CLAUDE.md's local Vale command drifted from the rendered ci.yml — CLAUDE.md=[$CLAUDE_CMD] but this gate runs [vale ${VALE_FLAGS[*]} ${FILES[*]}]. A maintainer following CLAUDE.md would lint a different set than CI."; exit 1; }

          # Checksum-verified, no sudo, run-scoped. #142 raised the unverified
          # download; the rendered ci.yml answered it with a SHA-pinned action.
          # The checksum here is a weaker answer and should not be read as an
          # equivalent one: it comes from the same release over the same
          # channel as the tarball, so it catches a truncated or corrupted
          # transfer, not a compromised release.
          #
          # errata-ai/vale was renamed to vale-cli/vale; both URLs still resolve
          # to the same release assets via GitHub's org redirect, but name it
          # the way ci.yml.jinja and .pre-commit-config.yaml.jinja already do so
          # all three agree if the redirect is ever retired.
          # Every command here is guarded, not just the checksum compare. The
          # asymmetry was the tell: the compare only runs once BOTH downloads
          # have succeeded, so it was the least likely to fire, while a 404
          # after a version bump produced `exit code 22` and no annotation at
          # all. Same diagnostic-loss class as the advisory block below.
          mkdir -p "$RUNNER_TEMP/valebin"
          TARBALL="vale_${VER}_Linux_64-bit.tar.gz"
          BASE="https://github.com/vale-cli/vale/releases/download/v${VER}"
          curl -sSfL -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL" \
            || { echo "::error::could not download $BASE/$TARBALL — vale $VER release asset missing or unreachable. The version comes from the rendered ci.yml, so check that pin first."; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$BASE/vale_${VER}_checksums.txt" \
            || { echo "::error::could not download the vale $VER checksums file from $BASE"; exit 1; }
          ( cd "$RUNNER_TEMP" && grep " $TARBALL\$" checksums.txt | sha256sum -c - ) \
            || { echo "::error::vale $VER tarball failed checksum verification"; exit 1; }
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/valebin" vale \
            || { echo "::error::vale $VER tarball has no 'vale' member at its root — release layout changed"; exit 1; }
          export PATH="$RUNNER_TEMP/valebin:$PATH"
          vale --version

          # Two variants, chosen for what they change in the LINTED set; see the
          # `authorization toggle-off render` step for why enable_authorization
          # and not the gate-off render. Both are rendered far above so they
          # pass through render hygiene while still pristine — this step must
          # consume those trees, never re-render one here.
          [ -d /tmp/smoke-authz-off ] \
            || { echo "::error::/tmp/smoke-authz-off missing — the authorization toggle-off render step did not run"; exit 1; }
          # D9 one level up. The file-count readback proves each run linted
          # something; this proves the SECOND run linted something different.
          # The variant is only meaningful because smoke-answers.yml sets
          # enable_authorization: true while copier.yml defaults it to false —
          # flip that fixture line and `--data enable_authorization=false`
          # renders a tree identical to /tmp/smoke. The gate would then lint
          # the same prose twice, report two healthy file counts, and stay
          # green while claiming to cover a branch no other step sees.
          if diff -rq /tmp/smoke/docs /tmp/smoke-authz-off/docs >/dev/null 2>&1 \
             && diff -q /tmp/smoke/README.md /tmp/smoke-authz-off/README.md >/dev/null 2>&1; then
            echo "::error::/tmp/smoke-authz-off has the same linted prose as /tmp/smoke — enable_authorization no longer differs between them, so the second variant proves nothing. Check enable_authorization in tests/fixtures/smoke-answers.yml."
            exit 1
          fi
          # Sync once and share the packs: the fetch is the expensive, network-
          # dependent part, and both renders resolve the same Packages line.
          ( cd /tmp/smoke && vale sync >/dev/null ) \
            || { echo "::error::vale sync failed — style packs unavailable, not a prose failure"; exit 1; }
          # VALE_PACKS comes from the pack-list lockstep step, which derives it
          # from the rendered .vale.ini. Unquoted on purpose: it is a
          # space-separated list and must word-split into the loop.
          [ -n "${VALE_PACKS:-}" ] \
            || { echo "::error::VALE_PACKS unset — the vale pack-list lockstep step did not run"; exit 1; }
          for PACK in $VALE_PACKS; do
            # Load-bearing on an INFERRED fact: that `vale sync` names each
            # pack directory after the registry name or the .zip basename.
            # If an upstream ever repackages with a different top-level
            # directory, this is where it surfaces — and unguarded it would
            # surface as `cp: cannot stat`, a packs problem wearing no
            # annotation at all, in the one step whose whole design is that
            # packs failures must be distinguishable from prose failures.
            cp -r "/tmp/smoke/.vale/styles/$PACK" /tmp/smoke-authz-off/.vale/styles/ \
              || { echo "::error::vale sync did not create .vale/styles/$PACK — the Packages-entry-to-directory-name derivation no longer holds. This is a pack problem, not a prose problem."; exit 1; }
          done
          for RENDER in /tmp/smoke /tmp/smoke-authz-off; do
            OUT=$( cd "$RENDER" && vale "${VALE_FLAGS[@]}" "${FILES[@]}" 2>&1 ) || {
              echo "$OUT"
              echo "::error::vale reports errors in $RENDER — rendered prose must be clean"
              # Google/proselint/write-good are listed without an @version, so
              # `vale sync` resolves them to the latest registry release on
              # every run (.vale.ini.jinja calls that intentional). A rule
              # added upstream therefore fails this gate on a PR that touched
              # no prose, and the message above would send the reader hunting
              # through their own diff. Say so here rather than pinning, which
              # is the trade .vale.ini.jinja deliberately declines.
              echo "::notice::if this PR changed no prose, suspect an upstream style-pack release: the registry packs resolve to latest on every sync"
              exit 1
            }
            echo "$OUT"
            # A non-empty extraction is NOT proof this gate linted anything.
            # Verified empirically: `vale --glob='!**' docs README.md` prints
            # "0 errors ... in 0 files." and exits 0. So a `files` list or glob
            # that stays syntactically valid while matching nothing turns this
            # step green over an empty set — the silent degradation the
            # extraction is meant to prevent, wearing a passing checkmark.
            # Vale reports the count it actually examined; require it positive.
            LINTED=$(sed -nE 's/.*[^0-9]([0-9]+) files?\..*/\1/p' <<<"$OUT" | tail -1)
            [ -n "$LINTED" ] \
              || { echo "::error::could not read vale's file count for $RENDER — output format changed, so the linted-nothing guard is no longer effective"; exit 1; }
            [ "$LINTED" -gt 0 ] \
              || { echo "::error::vale linted 0 files in $RENDER — the extracted file set (${FILES[*]}) and glob (${VALE_FLAGS[*]}) match nothing, so this gate proved nothing"; exit 1; }
            echo "linted $LINTED files in $RENDER"
          done

          # Advisory. An accepted vocabulary term suppresses non-spelling rules
          # inside its match span, so the gate above can pass prose that still
          # carries a flagged pattern. Reported, not enforced: a downstream's
          # own legitimate vocabulary additions must not break template CI.
          #
          # "Advisory" has to hold for the block's own failures too. It runs
          # under this step's `set -euo pipefail`, so an unguarded `cp` here
          # would abort the step with a bare `cp: cannot stat …` and no
          # ::error::, AFTER the real gate has already passed — turning the
          # advisory into a red build with no diagnostic, the exact
          # diagnostic-loss shape #256 removed from this file. The accept.txt
          # path is `_skip_if_exists` in copier.yml, so it is a rename-sensitive
          # literal: check it, and trap so an abort between the emptying and the
          # restore cannot leave the vocabulary gutted for later steps.
          ( cd /tmp/smoke
            ACC=.vale/styles/config/vocabularies/Base/accept.txt
            if [ ! -f "$ACC" ]; then
              echo "::warning::$ACC not found — skipping the suppressed-findings advisory"
              exit 0
            fi
            cp "$ACC" "$RUNNER_TEMP/accept.bak"
            trap 'cp "$RUNNER_TEMP/accept.bak" "$ACC" 2>/dev/null || true' EXIT
            grep -E '^\s*(#|$)' "$RUNNER_TEMP/accept.bak" > "$ACC" || true
            STRICT=$(vale "${VALE_FLAGS[@]}" "${FILES[@]}" 2>&1 | grep -E '^ *[0-9]+:' | grep -vc 'Vale.Spelling' || true)
            if [ "$STRICT" != "0" ]; then
              echo "::warning::$STRICT non-spelling Vale finding(s) are suppressed by an accepted vocabulary term; re-run with an emptied accept.txt to see them"
            fi ) || echo "::warning::the suppressed-findings advisory could not run; the gate above is unaffected"

      - name: detach smoke (FORKING.md commands produce a clean standalone state)
        working-directory: /tmp/smoke
        run: |
          # Mirrors the documented detach in the rendered FORKING.md. Runs LAST
          # because it mutates the tree in place; idempotence + gate already ran
          # on the pristine render. Asserts issue #182's Verification block.

          # --- Step 1: stop tracking ---
          rm -f .copier-answers.yml
          # --- Step 2: prune template-origin CI + fleet review wiring ---
          rm -f .github/workflows/copier-update.yml \
                .github/workflows/claude.yml \
                .github/workflows/claude-code-review.yml
          rm -f scripts/copier_update_aggregator.py
          rm -rf scripts/copier_update_prompts
          # --- Step 3 PREFLIGHT: every scrub anchor must exist, at the exact
          #     count the scrub expects (issue #199).
          #
          #     Without this the whole step passes VACUOUSLY whenever
          #     CLAUDE.md.jinja is reworded and the scrub is not: the `sed`
          #     matches nothing, and the post-scrub "wording is gone"
          #     assertions still pass — because the wording is gone from the
          #     SOURCE, not because the scrub removed it. Source and scrub
          #     drift out of coupling in lockstep and CI stays green, so a real
          #     detach regression ships to forks undetected.
          #
          #     Asserting counts (not mere presence) also catches the reverse
          #     drift: a new section that adds a fourth ` Kept across copier
          #     update.` the scrub was never told about.
          #
          #     Counts must be bumped deliberately when CLAUDE.md.jinja gains or
          #     loses one of these strings — that edit is exactly the moment to
          #     check FORKING.md's scrub still covers it.
          preflight_fail=0
          # `grep -oF | wc -l` counts OCCURRENCES, not matching lines as
          # `grep -c` would. Every anchor is one-per-line today, but the
          # "bump the count deliberately" model above only works if the number
          # means what a maintainer thinks it means — a future anchor twice on
          # one line would otherwise silently undercount and the drift guard
          # would pass. wc's leading padding is stripped so the string compare
          # below is exact.
          #
          # The trailing `|| true` is defensive, not currently load-bearing.
          # A zero-match grep exits 1, but this step has no `shell:` key, so
          # Actions runs it as `bash -e {0}` — WITHOUT pipefail, which is only
          # added for an explicit `shell: bash` — and the pipeline takes tr's
          # status (0). Should anyone add `shell: bash` or a `defaults.run`
          # shell later, pipefail would abort the step at the FIRST missing
          # anchor, killing the ::error:: diagnostics and the
          # accumulate-don't-stop behaviour both helpers rely on — precisely in
          # the drift case this step exists to report. `|| true` costs nothing
          # and makes the behaviour independent of that setting.
          count_occurrences() {
            grep -oF "$1" CLAUDE.md | wc -l | tr -d '[:space:]' || true
          }
          check_anchor() {
            actual=$(count_occurrences "$2")
            if [ "$actual" != "$1" ]; then
              echo "::error::scrub-anchor drift: expected $1 occurrence(s) of '$2' in the rendered CLAUDE.md, found $actual. CLAUDE.md.jinja was reworded without updating the detach scrub (FORKING.md + this workflow) — fix the scrub, or bump the expected count here if the change is intentional."
              preflight_fail=1
            fi
          }
          check_anchor 2 '<!-- TEMPLATE-TRACKING-START -->'
          check_anchor 2 '<!-- TEMPLATE-TRACKING-END -->'
          check_anchor 1 '<!-- ===== TEMPLATE-OWNED SECTIONS BELOW'
          check_anchor 1 '<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->'
          check_anchor 3 ' Kept across copier update.'
          check_anchor 1 ' on top of the shipped defaults survive `copier update`.'
          check_anchor 1 ' are preserved across `copier update`.'
          check_anchor 2 'The block is preserved across `copier update`.'
          check_anchor 1 ' on every `copier copy`/`copier update` and re-verified by'
          [ "$preflight_fail" = "0" ] \
            || { echo "::error::detach scrub is no longer coupled to CLAUDE.md.jinja — see the scrub-anchor drift errors above"; exit 1; }

          # --- Step 3: scrub CLAUDE.md template-tracking + copier-update wording ---
          # -i.bak + rm mirrors FORKING.md's portable form (GNU + BSD sed).
          sed -i.bak \
            -e '/<!-- TEMPLATE-TRACKING-START -->/,/<!-- TEMPLATE-TRACKING-END -->/d' \
            -e '/<!-- ===== TEMPLATE-OWNED SECTIONS BELOW/d' \
            -e '/<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->/d' \
            -e 's/ Kept across copier update\.//' \
            -e 's/ on top of the shipped defaults survive `copier update`\./ on top of the shipped defaults are yours to maintain./' \
            -e 's/ are preserved across `copier update`\./ are domain-owned./' \
            -e 's/The block is preserved across `copier update`\./The block is domain-owned./' \
            -e 's| on every `copier copy`/`copier update` and re-verified by| whenever config fields change, and re-verified by|' \
            CLAUDE.md && rm -f CLAUDE.md.bak
          # --- Closing ("You are now standalone"): remove the detach guide.
          #     FORKING.md's numbered Step 4 (README cleanup) is intentionally
          #     NOT mirrored here — it mutates README prose this smoke does not
          #     assert (a documented spec non-goal).
          rm -f FORKING.md

          # --- assert the detached state ---
          [ ! -f .copier-answers.yml ] \
            || { echo "::error::.copier-answers.yml still present after detach"; exit 1; }
          [ ! -f FORKING.md ] \
            || { echo "::error::FORKING.md not removed by detach"; exit 1; }
          ! grep -rn "copier" .github/ \
            || { echo "::error::copier reference remains under .github/ after detach"; exit 1; }
          # The first three tokens are issue #182's literal Verification block;
          # the last two ("lives upstream", "propagate here via copier update")
          # are actual prose inside the scrubbed TEMPLATE-TRACKING range, so this
          # grep bites on a regressed scrub rather than passing vacuously.
          ! grep -rniE "fleet|downstream conforms|shape lives in pvl-core|lives upstream|propagate here via .?copier update" CLAUDE.md \
            || { echo "::error::template-tracking language remains in CLAUDE.md after scrub"; exit 1; }
          # A detached fork's CLAUDE.md must not claim its sections are
          # overwritten or preserved by copier update (issue #184). The scrub
          # strips every such mention (banner fences, DOMAIN "Kept across" notes,
          # "preserved/survive across copier update" prose), so none may remain.
          ! grep -niF 'copier update' CLAUDE.md \
            || { echo "::error::copier-update wording remains in CLAUDE.md after detach scrub"; exit 1; }
          grep -qE '^## Shared Infrastructure$' CLAUDE.md \
            && { echo "::error::Shared Infrastructure section survived the scrub"; exit 1; } || true
          grep -qE '^## Contributing fixes upstream$' CLAUDE.md \
            && { echo "::error::Contributing fixes upstream section survived the scrub"; exit 1; } || true
          grep -qF 'bot reviewer (claude-review)' CLAUDE.md \
            && { echo "::error::bot-reviewer paragraph survived the scrub"; exit 1; } || true
          # Neutral guidance must remain. The scrub is a sed range-delete, so the
          # only "deleted too much" failure mode (given the pristine-render
          # marker-count guard already holds 2 balanced pairs) is a misplaced
          # marker that swallows a section adjacent to one of the FOUR marker
          # boundaries. Every boundary is bracketed by a must-survive assertion:
          #   pair 1 START → ## PR Discipline (above)
          #   pair 1 END   → ## GitHub Review Types (below)
          #   pair 2 START → ## Server Info Tool (above)
          #   pair 2 END   → ## Key Design Decisions (below; the TEMPLATE-OWNED
          #                  END fence that used to sit here is removed by the
          #                  scrub, so ## Key Design Decisions is now the sole
          #                  below-the-boundary over-run guard)
          # The remaining entries are the other sections FORKING.md promises survive.
          for kept_section in \
              '^## Conventions$' \
              '^## Hard PR Acceptance Gates$' \
              '^## PR Discipline$' \
              '^## Logging Standard$' \
              '^## Config & Customization Contract$' \
              '^## Server Info Tool' \
              '^## GitHub Review Types$' \
              '^## Key Design Decisions$'; do
            grep -qE "$kept_section" CLAUDE.md \
              || { echo "::error::neutral section '$kept_section' lost — scrub deleted too much"; exit 1; }
          done
          # The TEMPLATE-OWNED banner fences are intentionally removed by the
          # scrub (a detached fork owns every section), so assert both are gone.
          # The range-delete's bottom-boundary over-run guard is now
          # '## Key Design Decisions' (asserted in the kept-section loop above):
          # it sits below where the END fence was, so a range delete that ran to
          # EOF past pair 2 would drop it too.
          #
          # Asserted as TWO independent fixed-string checks, each using the same
          # literal its own `sed` -e deletes (issue #199). The previous single
          # alternation '^<!-- ===== TEMPLATE-OWNED SECTIONS (BELOW|END)' shared a
          # prefix with both fences, so it could not distinguish "the END fence
          # was deleted" from "the END fence was renamed and now neither the sed
          # nor this regex matches it" — the delete and its check failed
          # together instead of independently.
          ! grep -qF '<!-- ===== TEMPLATE-OWNED SECTIONS BELOW' CLAUDE.md \
            || { echo "::error::TEMPLATE-OWNED BELOW banner fence survived the detach scrub"; exit 1; }
          ! grep -qF '<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->' CLAUDE.md \
            || { echo "::error::TEMPLATE-OWNED END banner fence survived the detach scrub"; exit 1; }

          # --- the substitutions PRODUCED their replacement text ---
          # Absence of the old wording is not proof the scrub ran — the wording
          # could simply never have been there (issue #199, vector 2). Assert the
          # REPLACEMENT text the s/// commands emit, which can only appear if the
          # substitution actually fired. Counts mirror the preflight anchors.
          # Accumulates like check_anchor rather than exiting on the first
          # mismatch: if several substitutions silently fail to fire, one CI
          # run should name all of them, not send the maintainer round the
          # loop once per substitution.
          replacement_fail=0
          check_replacement() {
            actual=$(count_occurrences "$2")
            if [ "$actual" != "$1" ]; then
              echo "::error::detach scrub substitution did not fire: expected $1 occurrence(s) of '$2' after the scrub, found $actual"
              replacement_fail=1
            fi
          }
          check_replacement 1 ' on top of the shipped defaults are yours to maintain.'
          check_replacement 1 ' are domain-owned.'
          check_replacement 2 'The block is domain-owned.'
          check_replacement 1 ' whenever config fields change, and re-verified by'
          [ "$replacement_fail" = "0" ] \
            || { echo "::error::detach scrub ran but did not produce its replacement text — see the errors above"; exit 1; }
          # stripped files gone:
          for gone in \
              .github/workflows/copier-update.yml \
              .github/workflows/claude.yml \
              .github/workflows/claude-code-review.yml \
              scripts/copier_update_aggregator.py \
              scripts/copier_update_prompts; do
            [ ! -e "$gone" ] \
              || { echo "::error::$gone not removed by detach"; exit 1; }
          done
          # kept files present:
          for kept in \
              .github/workflows/ci.yml \
              .github/workflows/codeql.yml \
              .github/workflows/coverage-status.yml \
              .github/workflows/docs.yml \
              .github/workflows/release.yml; do
            [ -f "$kept" ] \
              || { echo "::error::$kept was removed but should be kept"; exit 1; }
          done
          echo "detach smoke passed"

  # Runs the two downstream workflow shapes that generated projects invoke
  # on their own CI — `mkdocs build --strict` (docs.yml) and `nfpm package`
  # (release.yml).  Dedicated non-matrix job so the downstream-gate is
  # decoupled from whichever Python versions render-and-gate's matrix rotates
  # through.  nfpm pinned to the same version as release.yml.jinja so a
  # template-ci pass genuinely implies a downstream-CI pass for this shape.
  downstream-gate:
    name: Downstream workflow gate (docs + packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.6"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Render smoke project with copier
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke

      - name: Install rendered project (with all extras and groups)
        working-directory: /tmp/smoke
        run: uv sync --all-extras --all-groups

      - name: Install nfpm
        # Pin matches release.yml.jinja so we exercise the same version
        # downstream projects will use.  Bump both in lockstep.
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: mkdocs build --strict
        working-directory: /tmp/smoke
        run: uv run mkdocs build --strict

      - name: nfpm package (deb)
        working-directory: /tmp/smoke
        run: |
          mkdir -p dist
          VERSION=0.0.0 ARCH=amd64 nfpm package --packager deb --target dist/ --config packaging/nfpm.yaml

      - name: nfpm package (rpm)
        working-directory: /tmp/smoke
        run: |
          mkdir -p dist
          VERSION=0.0.0 ARCH=amd64 nfpm package --packager rpm --target dist/ --config packaging/nfpm.yaml

      - name: docker build smoke
        # Catches Dockerfile structural regressions (base-image drift,
        # broken multi-line RUN chains, missing ENTRYPOINT/CMD/USER).
        working-directory: /tmp/smoke
        run: docker build --no-cache --progress=plain -t smoke-mcp-ci .

      - name: docker run smoke (verify state dirs + ownership)
        # Catches in-RUN sentinel-comment regressions: if a future Dockerfile
        # parser ever passed `#` lines through to the shell, the joined
        # `\\`-continuation would treat the DOCKERFILE-STATE-DIRS sentinel
        # as a shell comment and silently drop the mkdir/chown — but
        # `useradd` is the last preceding command and exits 0, so the build
        # itself would succeed. Verifying the directories exist and are
        # appuser-owned at runtime is what makes the sentinel guarantee
        # actually testable.
        run: |
          docker run --rm --entrypoint /bin/sh smoke-mcp-ci -c '
            stat -c "%U" /data/service | grep -qx appuser &&
            stat -c "%U" /data/state/fastmcp | grep -qx appuser
          '

  aggregator-tests:
    name: Aggregator script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.6"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run aggregator tests
        run: uv run --with pytest --with pyyaml --with jsonschema --with 'fastmcp-pvl-core>=4.5.0' pytest scripts/tests/ -v

      - name: Lint aggregator (ruff check matching downstream's config)
        # Mirror the rendered project's [tool.ruff.lint] block in
        # pyproject.toml.jinja: same `select` list, same `ignore = ["E501"]`,
        # same line-length 88. Catch regressions here before they surface in
        # downstream CI on the next copier-update.
        run: |
          uv run --with ruff ruff check \
            --select E,W,F,I,B,C4,UP,ARG,SIM,TC,PTH,RUF \
            --ignore E501 \
            --line-length 88 \
            scripts/copier_update_aggregator.py scripts/check_render_hygiene.py scripts/gen_config_surface.py scripts/tests/

      - name: Format check aggregator (ruff format matching downstream)
        run: |
          uv run --with ruff ruff format --check --line-length 88 \
            scripts/copier_update_aggregator.py scripts/check_render_hygiene.py scripts/gen_config_surface.py scripts/tests/
