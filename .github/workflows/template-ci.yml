name: template-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render-and-gate:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Render smoke project with copier
        # --vcs-ref=HEAD is not optional here; every render step in this file
        # carries it. See the `clean-tree opt-out render` step below for why,
        # and why removing it from one step alone breaks the job locally.
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke

      - name: Idempotence check (second render is byte-identical)
        # Runs BEFORE the gate so the first render is still pristine.
        # ``uv sync``/``ruff``/``mypy``/``pytest`` would otherwise add
        # .venv, uv.lock, .mypy_cache etc. that the second (untouched)
        # render doesn't have.
        #
        # This render and the one above must stay pinned to the SAME ref.
        # Pinning one and not the other makes them render different templates
        # in a tag-bearing clone, and this diff then reports an idempotence
        # failure that does not exist.
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke2
          if ! diff -r /tmp/smoke /tmp/smoke2 > /tmp/smoke-diff 2>&1; then
            echo "::error::second render differs from first — template is not idempotent"
            cat /tmp/smoke-diff
            exit 1
          fi

      - name: structural gate toggle-off render
        # The smoke project rendered in the first step has the gate ON, so the
        # install/lint/test steps that follow exercise the gate's artifacts and
        # its own test suite. This step renders a SECOND project with the gate
        # OFF and asserts every gated artifact is absent — the generated suite
        # cannot cover this (test_structural_gate.py does not render when the
        # gate is off), so a jinja edit that leaks an artifact past its
        # {% raw %}{% if %}{% endraw %} guard would otherwise pass CI silently.
        # One assertion per independently-gated block (pyproject has two: the
        # mccabe/pylint thresholds AND the tests/** S-ignore).
        run: |
          rm -rf /tmp/smoke-gate-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data enable_structural_gate=false \
            . /tmp/smoke-gate-off
          cd /tmp/smoke-gate-off
          test ! -f tests/test_structural_gate.py \
            || { echo "::error::structural test rendered with gate off"; exit 1; }
          test ! -f tests/.jinja \
            || { echo "::error::conditional filename left a stray tests/.jinja"; exit 1; }
          ! grep -q 'structural-diff-gate' .pre-commit-config.yaml \
            || { echo "::error::pre-push hook rendered with gate off"; exit 1; }
          ! grep -q 'default_install_hook_types' .pre-commit-config.yaml \
            || { echo "::error::default_install_hook_types rendered with gate off"; exit 1; }
          ! grep -qE '^  structure:' .github/workflows/ci.yml \
            || { echo "::error::structure CI job rendered with gate off"; exit 1; }
          ! grep -q 'tool.ruff.lint.mccabe' pyproject.toml \
            || { echo "::error::structural thresholds rendered with gate off"; exit 1; }
          ! grep -qF '"tests/**"' pyproject.toml \
            || { echo "::error::structural tests/** S-ignore rendered with gate off"; exit 1; }
          ! grep -q '## Structural health' AGENTS.md \
            || { echo "::error::structural-health section rendered with gate off"; exit 1; }
          ! grep -qF 'Structural quality (diff) passes' AGENTS.md \
            || { echo "::error::structural acceptance-gate item rendered with gate off"; exit 1; }

      - name: authorization toggle-off render
        # Rendered for the Vale gate far below, but rendered HERE, beside its
        # sibling variants and before anything writes into a tree, so it passes
        # through the render-hygiene step like every other variant. Moving it
        # down to its consumer would put it after `uv sync` and after the gate's
        # own pack copy, where hygiene can no longer be checked at all.
        #
        # Chosen for what it changes in the LINTED set. Not the gate-off render
        # above: enable_structural_gate toggles nothing under docs/ or
        # README.md, so that variant's prose is byte-identical to /tmp/smoke.
        # enable_authorization is the flag that matters — off, it drops
        # docs/guides/authorization.md entirely and changes both README.md and
        # docs/guides/authentication.md, so its prose is a branch no other step
        # sees.
        run: |
          rm -rf /tmp/smoke-authz-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data enable_authorization=false \
            . /tmp/smoke-authz-off

      - name: Render automatic-review variant
        run: |
          rm -rf /tmp/smoke-claude-review-on
          uv run --no-project --with copier copier copy --trust --defaults \
            --vcs-ref=HEAD --data-file tests/fixtures/smoke-answers.yml \
            --data enable_automatic_claude_review=true \
            . /tmp/smoke-claude-review-on

      - name: clean-tree opt-out render
        # Split out from the assertion step below and placed here for the same
        # reason as the authorization render above: a variant rendered after the
        # hygiene gate is a branch that gate never sees. The opt-out is a
        # {%- if %} trim inside tests/test_structural_gate.py, which is exactly
        # the "Jinja tag in one branch of a conditional" class of #251.
        #
        # --vcs-ref=HEAD renders the working-tree commit — the canonical
        # explanation for every render step in this file. Without it copier
        # defaults to the latest git tag, which predates this step's variable: a
        # clone that HAS tags (a normal local checkout) then renders the old
        # template, ignores the --data, and the assertions below break. CI's
        # default checkout fetches no tags, so copier falls through to HEAD and
        # they pass even unpinned — i.e. an omitted pin slips through CI and
        # breaks only on a local full clone.
        #
        # EVERY render step here carries the pin for that reason; they are not
        # independent choices. The Vale gate forced the issue: it lints rendered
        # PROSE, so in a tag-bearing clone it reported 19 errors against docs the
        # merged tree had already fixed, blaming the working tree for the last
        # release's text. The assertion-only steps failed less loudly but the
        # same way. Pin them together or the job means something different
        # locally than it does in CI.
        #
        # The smoke/smoke2 idempotence pair in particular must stay pinned
        # TOGETHER: pinning one and not the other makes them render different
        # templates in a tag-bearing clone, and the diff reports a template
        # idempotence failure that does not exist.
        #
        # Only the OPT-OUT variant is rendered. The flag-true render used to be
        # done here as /tmp/smoke-cleantree-on with an invocation identical to
        # the first render step's — same answers file, same --defaults, no
        # --data override, because structural_gate_assert_clean_tree is absent
        # from smoke-answers.yml and defaults to true. That made it a
        # byte-identical copy of /tmp/smoke, which the idempotence check
        # already proves cannot differ, at the cost of a sixth full copier
        # render per matrix leg — each running _tasks, including vendor_spa.py's
        # network download. /tmp/smoke IS the flag-true render; the assertions
        # below use it directly.
        run: |
          rm -rf /tmp/smoke-cleantree-off
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            --data structural_gate_assert_clean_tree=false \
            . /tmp/smoke-cleantree-off

      - name: render hygiene (pristine render already satisfies the shipped hooks)
        # The template ships `trailing-whitespace` and `end-of-file-fixer`
        # (.pre-commit-config.yaml.jinja). Both REWRITE files, so anything they
        # would touch in a pristine render is a latent `copier update` conflict:
        # the downstream commits the fixed-up form, so copier's 3-way merge sees
        # `ours` != `base` in that region, and the first template version that
        # also changes that region conflicts for EVERY downstream.
        #
        # Issue #251 is the real instance — ci.yml.jinja used to end with the
        # endif closing the structural-gate block, and Jinja (no trim_blocks)
        # keeps the newline after a block tag, so the render ended with a blank
        # line. end-of-file-fixer stripped it downstream; the v2.11.0
        # `ci-success` job then appended to that exact tail and every
        # downstream's ci.yml conflicted. Latent for months because nothing had
        # touched ci.yml's tail before.
        #
        # Runs BEFORE `uv sync` so the render is still pristine, and covers
        # EVERY rendered variant — a Jinja tag at EOF only appears in one branch
        # of a conditional, so checking a single variant would miss it. Any new
        # render step belongs above this one and in the argument list below;
        # a variant rendered further down is a branch this guard never sees.
        # /tmp/smoke2 is excluded deliberately: the idempotence step already
        # asserts it is byte-identical to /tmp/smoke, so checking it again
        # could not fail independently.
        run: |
          python3 scripts/check_render_hygiene.py \
            /tmp/smoke /tmp/smoke-gate-off /tmp/smoke-authz-off \
            /tmp/smoke-claude-review-on /tmp/smoke-cleantree-off

      - name: Claude workflow presence matrix
        run: |
          test -f /tmp/smoke/.github/workflows/claude.yml
          test ! -e /tmp/smoke/.github/workflows/claude-code-review.yml
          test ! -e /tmp/smoke/.github/workflows/.jinja
          test -f /tmp/smoke-claude-review-on/.github/workflows/claude.yml
          test -f /tmp/smoke-claude-review-on/.github/workflows/claude-code-review.yml
          test ! -e /tmp/smoke-claude-review-on/.github/workflows/.jinja

      - name: structural gate clean-tree assertion present (default) / dropped (opt-out)
        # structural_gate_assert_clean_tree gates ONLY the whole-tree clean
        # assertion (test_shipped_code_passes_…): default true keeps it; false
        # drops it so a brownfield repo with pre-existing structural debt can
        # adopt the gate while the diff-scoped gate, pre-push hook, CI 'structure'
        # job, and behavioural tests all remain. A test cannot assert its own
        # absence, and a missing test passes pytest vacuously, so assert the
        # rendered file directly — BOTH halves: present under the default render,
        # absent under the opt-out (an inverted condition would otherwise drop the
        # self-check from every downstream and still go green). The opt-out
        # render comes from the `clean-tree opt-out render` step above, which is
        # also where the --vcs-ref=HEAD rationale lives; the flag-true half
        # asserts against /tmp/smoke directly, since that IS the flag-true
        # render.
        #
        # Both rendered variants of the gate's own test file are then linted: the
        # opt-out trim must leave no unused import, and the jinja if/endif
        # whitespace seam must stay format-clean in both the present and absent
        # branches.
        run: |
          grep -q 'def test_shipped_code_passes_the_structural_overlay_cleanly' /tmp/smoke/tests/test_structural_gate.py \
            || { echo "::error::clean-tree assertion missing from the default render"; exit 1; }
          # opt-out render (flag false): the whole-tree self-check MUST be dropped,
          # everything else MUST remain.
          off=/tmp/smoke-cleantree-off
          test -f "$off/tests/test_structural_gate.py" \
            || { echo "::error::structural test file missing — gate should still render"; exit 1; }
          ! grep -q 'def test_shipped_code_passes_the_structural_overlay_cleanly' "$off/tests/test_structural_gate.py" \
            || { echo "::error::clean-tree assertion rendered despite opt-out"; exit 1; }
          grep -q 'def test_options_reach_ruff_and_gate_is_diff_scoped' "$off/tests/test_structural_gate.py" \
            || { echo "::error::diff-scope behavioural test dropped by clean-tree opt-out"; exit 1; }
          grep -q 'structural-diff-gate' "$off/.pre-commit-config.yaml" \
            || { echo "::error::pre-push hook dropped by clean-tree opt-out"; exit 1; }
          grep -qE '^  structure:' "$off/.github/workflows/ci.yml" \
            || { echo "::error::structure CI job dropped by clean-tree opt-out"; exit 1; }
          # both branches of the conditional must lint + format clean (catches an
          # unused import left by the trim and any if/endif whitespace regression).
          for d in /tmp/smoke /tmp/smoke-cleantree-off; do
            ( cd "$d" \
              && uv run --no-project --with ruff ruff check --config pyproject.toml tests/test_structural_gate.py \
              && uv run --no-project --with ruff ruff format --check --config pyproject.toml tests/test_structural_gate.py ) \
              || { echo "::error::rendered structural test ($d) is not lint/format-clean"; exit 1; }
          done

      - name: Install rendered project
        working-directory: /tmp/smoke
        run: uv sync --all-extras --all-groups

      - name: Assert MCP Apps SPA was vendored
        working-directory: /tmp/smoke
        run: |
          test -f src/smoke_mcp/static/app.html
          uv run python scripts/vendor_spa.py --check

      - name: ruff check
        working-directory: /tmp/smoke
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: /tmp/smoke
        run: uv run ruff format --check .

      - name: mypy
        working-directory: /tmp/smoke
        run: uv run mypy src/ tests/

      - name: pytest
        working-directory: /tmp/smoke
        run: uv run pytest -x -q

      - name: AGENTS.md sentinel structure
        working-directory: /tmp/smoke
        run: |
          # Line-anchored regexes so prose mentions don't satisfy the check.
          # Count assertions so a dropped inner DOMAIN-START/END pair fails
          # loudly — copier's 3-way merge needs all fences intact.
          # `|| true` keeps bash -e from aborting at the command substitution when
          # grep finds zero matches (exit 1), so the ::error:: lines below fire
          # instead of an opaque "exit 1" without context.
          start=$(grep -cE '^<!-- DOMAIN-START -->$' AGENTS.md || true)
          end=$(grep -cE '^<!-- DOMAIN-END -->$' AGENTS.md || true)
          [ "$start" = "3" ] || { echo "::error::expected 3 DOMAIN-START fences, found $start"; exit 1; }
          [ "$end" = "3" ] || { echo "::error::expected 3 DOMAIN-END fences, found $end"; exit 1; }
          grep -qE '^<!-- ===== TEMPLATE-OWNED SECTIONS BELOW' AGENTS.md || { echo "::error::missing TEMPLATE-OWNED opening fence"; exit 1; }
          grep -qE '^<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->$' AGENTS.md || { echo "::error::missing TEMPLATE-OWNED closing fence"; exit 1; }
          # TEMPLATE-TRACKING marker pairs (2 in AGENTS.md): one around the
          # bot-reviewer paragraph, one around Shared Infrastructure +
          # Contributing fixes upstream. The Release notes pages pair moved to
          # the releasing skill with the rest of the release sections (#486)
          # and is checked separately below. FORKING.md's detach scrub deletes
          # these as a sed range — a dropped marker would make the scrub
          # delete the wrong span, so the count must stay exact, and it must
          # match the detach smoke's check_anchor counts further down.
          ttstart=$(grep -cE '^<!-- TEMPLATE-TRACKING-START -->$' AGENTS.md || true)
          ttend=$(grep -cE '^<!-- TEMPLATE-TRACKING-END -->$' AGENTS.md || true)
          [ "$ttstart" = "2" ] || { echo "::error::expected 2 TEMPLATE-TRACKING-START markers, found $ttstart"; exit 1; }
          [ "$ttend" = "2" ] || { echo "::error::expected 2 TEMPLATE-TRACKING-END markers, found $ttend"; exit 1; }
          rp=$(grep -cE '^<!-- TEMPLATE-TRACKING-START -->$' docs/deployment/release-process.md || true)
          [ "$rp" = "1" ] || { echo "::error::expected 1 TEMPLATE-TRACKING pair in release-process.md, found $rp"; exit 1; }
          rel=$(grep -cE '^<!-- TEMPLATE-TRACKING-START -->$' .agents/skills/releasing/SKILL.md || true)
          [ "$rel" = "1" ] || { echo "::error::expected 1 TEMPLATE-TRACKING pair in releasing skill, found $rel"; exit 1; }

      - name: AGENTS.md template-owned size budget
        working-directory: /tmp/smoke
        run: |
          # Claude Code warns above 40k always-loaded chars.  The smoke render's
          # DOMAIN blocks are near-empty, so this measures the template's share;
          # 24k leaves every downstream >=16k for domain content (#484).
          size=$(wc -c < AGENTS.md | tr -d '[:space:]')
          [ "$size" -le 24000 ] || { echo "::error::AGENTS.md template-owned prose is ${size} chars (> 24000). Move guidance into a skill under .agents/skills/ rather than growing the always-loaded file."; exit 1; }

      - name: shared docs render with consumer env_prefix
        working-directory: /tmp/smoke
        run: |
          # Smoke answers set env_prefix=SMOKE_MCP — rendered docs
          # should name some consumer-prefixed env var, never the placeholder.
          # Negative check uses a word-boundary regex so legitimate
          # rendered tokens like SMOKE_MCP_SERVER_NAME don't false-positive
          # as MCP_SERVER_ leaks (substring collision).
          for f in \
              docs/deployment/oidc.md \
              docs/deployment/docker.md \
              docs/guides/authentication.md; do
            grep -qE 'SMOKE_MCP_[A-Z][A-Z0-9_]*' "$f" \
              || { echo "::error::$f missing any SMOKE_MCP_ env var — substitution did not occur"; exit 1; }
          done
          ! grep -lE '(^|[^A-Z0-9_])MCP_SERVER_' \
              docs/deployment/docker.md \
              docs/deployment/oidc.md \
              docs/guides/authentication.md \
            || { echo "::error::MCP_SERVER_ placeholder literal leaked into shared docs"; exit 1; }
          ! grep -lF fastmcp-server-template \
              docs/deployment/docker.md \
              docs/deployment/oidc.md \
              docs/guides/authentication.md \
            || { echo "::error::fastmcp-server-template literal leaked into shared docs"; exit 1; }

      - name: OIDC generated env-var tables (markers, content, idempotence)
        # docs/deployment/oidc.md's and docs/guides/authentication.md's OIDC
        # env-var tables are generated from a single source of truth
        # (scripts/gen_config_surface.py), spliced between
        # GENERATED-ENV-TABLE-OIDC-{REQUIRED,OPTIONAL} markers — replacing
        # two hand-maintained tables that had drifted out of sync with core
        # and with each other. Nothing in this file asserted anything about
        # that generated content before this step.
        #
        # Placed here, not right after the render: it needs the rendered
        # project's own venv (`uv sync`, above) so `gen_config_surface.py
        # --check` imports fastmcp-pvl-core from it directly rather than
        # re-execing under an ad hoc `uv run --no-project` download. Grouped
        # with the "shared docs render" step just above because both inspect
        # the same two files' rendered content — this one only reads them
        # (plus the offline `--check`, which never writes), so it does not
        # need to run before render hygiene the way a step that WRITES into
        # the tree would.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          OIDC=docs/deployment/oidc.md
          AUTH=docs/guides/authentication.md

          # --- #260 regression guard, the load-bearing outcome: the
          # "ephemeral"/restart-invalidation wording that used
          # to describe the JWT signing key must never come back, whether
          # from the generator or a hand-edit inside the marker'd region.
          ! grep -rniE 'ephemeral|invalidates.*restart|Required on Linux' "$OIDC" "$AUTH" \
            || { echo "::error::#260 regression — 'ephemeral'/restart-invalidation wording found in the generated OIDC tables"; exit 1; }

          # --- markers present, with data rows between them, in both files.
          region() {  # region <file> <REQUIRED|OPTIONAL>
            sed -n "/GENERATED-ENV-TABLE-OIDC-$2-START/,/GENERATED-ENV-TABLE-OIDC-$2-END/p" "$1"
          }
          for f in "$OIDC" "$AUTH"; do
            for kind in REQUIRED OPTIONAL; do
              grep -qF "GENERATED-ENV-TABLE-OIDC-$kind-START" "$f" \
                || { echo "::error::$f missing GENERATED-ENV-TABLE-OIDC-$kind-START marker"; exit 1; }
              grep -qF "GENERATED-ENV-TABLE-OIDC-$kind-END" "$f" \
                || { echo "::error::$f missing GENERATED-ENV-TABLE-OIDC-$kind-END marker"; exit 1; }
              # `|| true` guards the command substitution against `set -e`:
              # a zero-match grep under `-c` still exits 1, which would abort
              # the step here rather than let the `-gt 0` check below report
              # it with context (same guard shape the vale lockstep steps use).
              rows=$(region "$f" "$kind" | grep -cE '^\| `' || true)
              [ "$rows" -gt 0 ] \
                || { echo "::error::$f GENERATED-ENV-TABLE-OIDC-$kind region has no data rows between its markers"; exit 1; }
            done
          done

          # --- the four connection vars land in REQUIRED; the rest land in
          # OPTIONAL — env_prefix is fixed to SMOKE_MCP by smoke-answers.yml,
          # matching the "shared docs render" step above.
          for f in "$OIDC" "$AUTH"; do
            for var in SMOKE_MCP_BASE_URL SMOKE_MCP_OIDC_CONFIG_URL SMOKE_MCP_OIDC_CLIENT_ID SMOKE_MCP_OIDC_CLIENT_SECRET; do
              region "$f" REQUIRED | grep -qF "\`$var\`" \
                || { echo "::error::$f REQUIRED region missing $var"; exit 1; }
            done
            for var in SMOKE_MCP_OIDC_AUDIENCE SMOKE_MCP_OIDC_REQUIRED_SCOPES SMOKE_MCP_OIDC_JWT_SIGNING_KEY SMOKE_MCP_OIDC_VERIFY_ACCESS_TOKEN; do
              region "$f" OPTIONAL | grep -qF "\`$var\`" \
                || { echo "::error::$f OPTIONAL region missing $var"; exit 1; }
            done
          done

          # --- signing-key row: Default `derived`, and the description never
          # abbreviates to "JWTs" (pvl-core <5 said "JWTs" and the generator's
          # vocabulary expanded it; 5.0 dropped the term from its own text).
          for f in "$OIDC" "$AUTH"; do
            signing_row=$(region "$f" OPTIONAL | grep -F '`SMOKE_MCP_OIDC_JWT_SIGNING_KEY`') \
              || { echo "::error::$f OPTIONAL region missing the signing-key row"; exit 1; }
            echo "$signing_row" | grep -qF '| `derived` |' \
              || { echo "::error::$f signing-key row does not show Default \`derived\`: $signing_row"; exit 1; }
            ! echo "$signing_row" | grep -qF 'JWTs' \
              || { echo "::error::$f signing-key row still abbreviates to 'JWTs'"; exit 1; }
          done

          # --- generation is idempotent on this pristine render: the
          # committed generator output already matches a fresh, offline
          # re-generation. Mirrors the `--check` step the rendered project's
          # OWN ci.yml.jinja runs on every downstream commit; nothing in
          # template-ci exercised it before this step.
          uv run python scripts/gen_config_surface.py --check \
            || { echo "::error::gen_config_surface.py --check reports the rendered config artifacts are stale — generation is not idempotent"; exit 1; }

      - name: server.json generated env-var arrays (packaging, identity)
        # server.json's two `environmentVariables` arrays are spliced from
        # the same scripts/gen_config_surface.py source of truth as the OIDC
        # tables above (config-presentation.yml's `packaging:` map), but
        # located by JSON path rather than a GENERATED-* marker pair — JSON
        # has no comment syntax for one to live in. Idempotence is already
        # covered by the `--check` run in the step above (one generator
        # writes every declared artifact, server.json included); this step
        # only asserts package membership and that the two fields
        # scripts/stamp_manifests.py owns (version, the OCI identifier)
        # survived the splice untouched.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          SERVER=server.json

          # --- pypi package: the shrunk set. A uvx/stdio install has no HTTP
          # listener and no OAuth callback, so no OIDC/auth/container var
          # belongs there.
          pypi_names=$(jq -r '.packages[0].environmentVariables[].name' "$SERVER")
          for var in SMOKE_MCP_KV_STORE_URL FASTMCP_LOG_LEVEL; do
            echo "$pypi_names" | grep -qxF "$var" \
              || { echo "::error::server.json packages[0] (pypi) missing $var"; exit 1; }
          done
          if echo "$pypi_names" | grep -qxF SMOKE_MCP_OIDC_CLIENT_SECRET; then
            echo "::error::server.json packages[0] (pypi) carries an OIDC var"
            exit 1
          fi

          # --- oci package: the OIDC/auth/container vars, present here
          # because smoke-answers.yml sets enable_authorization: true.
          oci_names=$(jq -r '.packages[1].environmentVariables[].name' "$SERVER")
          for var in SMOKE_MCP_OIDC_CONFIG_URL SMOKE_MCP_OIDC_CLIENT_ID \
              SMOKE_MCP_OIDC_CLIENT_SECRET SMOKE_MCP_BASE_URL SMOKE_MCP_BEARER_TOKEN \
              SMOKE_MCP_ACL_PATH SMOKE_MCP_AUTHZ_CLAIM PUID PGID; do
            echo "$oci_names" | grep -qxF "$var" \
              || { echo "::error::server.json packages[1] (oci) missing $var"; exit 1; }
          done

          # --- identity fields scripts/stamp_manifests.py owns must survive
          # the splice untouched — the whole reason kind: json-splice
          # replaces one array per package rather than the file.
          version=$(jq -r '.version' "$SERVER")
          [ "$version" = "0.1.0" ] \
            || { echo "::error::server.json top-level version changed unexpectedly: $version"; exit 1; }
          identifier=$(jq -r '.packages[1].identifier' "$SERVER")
          [ "$identifier" = "ghcr.io/pvliesdonk/smoke-mcp:v0.1.0" ] \
            || { echo "::error::server.json OCI identifier regressed: $identifier"; exit 1; }

          # --- isRequired must never be asserted in a package manifest — see
          # gen_config_surface.py's `_render_json_env_entry` docstring for
          # why: the flag has no feature-conditional scoping, and marking
          # e.g. the OIDC vars required would assert that an unauthenticated
          # deployment (which this project documents as supported) cannot
          # start.
          ! jq -e '..|.isRequired? // empty' "$SERVER" >/dev/null \
            || { echo "::error::server.json asserts isRequired on at least one environmentVariables entry"; exit 1; }

      - name: server.json schema validation (vendored MCP registry schema)
        # Real schema validation for the whole rendered server.json against
        # the MCP registry's own 2025-12-11 server.schema.json — the step
        # above only hand-asserts individual properties (package membership,
        # identity fields), never that the document as a whole is
        # schema-valid. The schema is vendored at schemas/server.schema.json
        # in the TEMPLATE checkout; copier.yml's `_exclude` keeps it out of
        # every rendered project, so it is read from $GITHUB_WORKSPACE here
        # rather than from /tmp/smoke. jsonschema is a rendered-project
        # dependency, already installed by `uv sync` above.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          uv run python3 - "$GITHUB_WORKSPACE/schemas/server.schema.json" <<'PY' || { echo "::error::server.json does not validate against schemas/server.schema.json"; exit 1; }
          import json
          import sys

          import jsonschema

          schema_path = sys.argv[1]
          data = json.load(open("server.json", encoding="utf-8"))
          schema = json.load(open(schema_path, encoding="utf-8"))
          jsonschema.validate(instance=data, schema=schema)
          print(f"server.json validates against {schema_path}")
          PY

      - name: README generated env-var tables (markers, content)
        # README.md's "Configuration" and "Domain configuration" sections
        # are spliced from the same scripts/gen_config_surface.py source of
        # truth as the OIDC tables above, between GENERATED-ENV-TABLE-CORE
        # and GENERATED-ENV-TABLE-DOMAIN markers — replacing two
        # hand-maintained tables. Nothing in this file asserted anything
        # about that generated content before this step.
        #
        # Idempotence of these regions is already covered by the OIDC
        # step's `--check` just above: one generator writes every spliced
        # file (README.md included), and one offline `--check` validates
        # all of its output, so this step does not repeat that check —
        # it only asserts markers and content.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          README=README.md

          region() {  # region <CORE|DOMAIN>
            sed -n "/GENERATED-ENV-TABLE-$1-START/,/GENERATED-ENV-TABLE-$1-END/p" "$README"
          }

          # --- markers present for both regions.
          for kind in CORE DOMAIN; do
            grep -qF "GENERATED-ENV-TABLE-$kind-START" "$README" \
              || { echo "::error::$README missing GENERATED-ENV-TABLE-$kind-START marker"; exit 1; }
            grep -qF "GENERATED-ENV-TABLE-$kind-END" "$README" \
              || { echo "::error::$README missing GENERATED-ENV-TABLE-$kind-END marker"; exit 1; }
          done

          # --- CORE region: exactly the three shared pvl-core vars, each
          # paired with its expected Default cell — an added, dropped, or
          # renamed CORE var, or a changed default, fails this step.
          # `|| true` guards the command substitutions against `set -e`: a
          # zero-match grep under `-c`/no-match `grep -F` still exits 1,
          # which would abort the step here rather than let the checks
          # below report it with context (same guard shape the OIDC step
          # above uses).
          kv_row=$(region CORE | grep -F '`SMOKE_MCP_KV_STORE_URL`') \
            || { echo "::error::$README CORE region missing the SMOKE_MCP_KV_STORE_URL row"; exit 1; }
          echo "$kv_row" | grep -qF '| `file:///data/state` |' \
            || { echo "::error::$README KV_STORE_URL row does not show Default \`file:///data/state\`: $kv_row"; exit 1; }

          log_row=$(region CORE | grep -F '`FASTMCP_LOG_LEVEL`') \
            || { echo "::error::$README CORE region missing the FASTMCP_LOG_LEVEL row"; exit 1; }
          echo "$log_row" | grep -qF '| `INFO` |' \
            || { echo "::error::$README LOG_LEVEL row does not show Default \`INFO\`: $log_row"; exit 1; }

          rich_row=$(region CORE | grep -F '`FASTMCP_ENABLE_RICH_LOGGING`') \
            || { echo "::error::$README CORE region missing the FASTMCP_ENABLE_RICH_LOGGING row"; exit 1; }
          echo "$rich_row" | grep -qF '| `true` |' \
            || { echo "::error::$README RICH_LOGGING row does not show Default \`true\`: $rich_row"; exit 1; }

          core_rows=$(region CORE | grep -cE '^\| `' || true)
          [ "$core_rows" -eq 3 ] \
            || { echo "::error::$README CORE region has $core_rows data rows, expected exactly 3"; exit 1; }

          # --- DOMAIN region: header row present. The smoke render has no
          # domain fields, so this only asserts the table header — NOT data
          # rows, which the no-domain-fields smoke render would never have.
          region DOMAIN | grep -qF '| Variable | Default | Required | Description |' \
            || { echo "::error::$README DOMAIN region missing its table header row"; exit 1; }

      - name: README doc-site links resolve on a versioned deployment
        # docs.yml publishes with mike, which serves every file under a
        # version path plus a `latest` alias. The site ROOT redirects to that
        # alias, so a bare `…github.io/<project>/` link works — but any deeper
        # link must carry the version segment itself, or it 404s on a real
        # deployment while looking perfectly fine in review. #453 is the
        # instance: the llms.txt badge and its Links entry both pointed at the
        # unversioned root and had never resolved on any generated project.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          # Every doc-site URL in the README, minus the two forms that work:
          # the bare root, and anything already under `latest/`.
          bad=$(grep -oE 'https://[A-Za-z0-9_.-]+\.github\.io/[A-Za-z0-9_.-]+/[^)"[:space:]]*' README.md \
            | grep -vE '\.github\.io/[A-Za-z0-9_.-]+/$' \
            | grep -vE '\.github\.io/[A-Za-z0-9_.-]+/latest/' || true)
          if [ -n "$bad" ]; then
            echo "::error::README doc-site deep link(s) missing the version segment — these 404 under mike; use /latest/:"
            echo "$bad"
            exit 1
          fi

      - name: rendered rulesets are valid and require CI Success
        # The branch rulesets render `extra_required_checks` into their
        # required-checks array (#454), and bootstrap.yml feeds each file
        # straight to `gh api --input`. A render that produced malformed JSON,
        # or that dropped the aggregate context, would only surface as a failed
        # apply — or worse, as protection that silently requires less than it
        # claims. The smoke answers leave the seam empty, so this also pins the
        # property that costs downstreams nothing: with no extra checks, the
        # rendered files are exactly the single-context form they already have.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          for file in .github/rulesets/*.json; do
            jq empty "$file" || { echo "::error::$file is not valid JSON"; exit 1; }
          done
          for file in .github/rulesets/protect-main.json .github/rulesets/protect-release-branches.json; do
            contexts=$(jq -c '[.rules[] | select(.type == "required_status_checks")
                               | .parameters.required_status_checks[].context]' "$file")
            [ "$contexts" = '["CI Success"]' ] \
              || { echo "::error::$file requires $contexts, expected [\"CI Success\"] on a render with no extra_required_checks"; exit 1; }
          done

      - name: ci.yml sets up its environment through the shared composite
        # The uv + interpreter-cache + `uv sync` sequence lives in
        # .github/actions/setup-project-env so a change to the uv pin, the
        # cache key or the sync flags lands once instead of once per job
        # (#455). A job that inlines its own copy re-opens exactly that decay,
        # and a downstream domain workflow copying from ci.yml would propagate
        # it, so assert the rendered ci.yml holds no copy at all.
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          test -f .github/actions/setup-project-env/action.yml \
            || { echo "::error::setup-project-env composite missing from the render"; exit 1; }
          ! grep -qF 'astral-sh/setup-uv' .github/workflows/ci.yml \
            || { echo "::error::ci.yml inlines the uv setup again — call ./.github/actions/setup-project-env instead"; exit 1; }
          grep -qF 'uses: ./.github/actions/setup-project-env' .github/workflows/ci.yml \
            || { echo "::error::ci.yml no longer calls the setup-project-env composite"; exit 1; }

      - name: Dockerfile sentinel structure
        working-directory: /tmp/smoke
        run: |
          for marker in \
            "# DOCKERFILE-STATE-DIRS-START" \
            "# DOCKERFILE-STATE-DIRS-END" \
            "# DOCKERFILE-VOLUMES-START" \
            "# DOCKERFILE-VOLUMES-END"; do
            # `|| true` keeps bash -e from aborting at the command substitution when
            # grep finds zero matches (exit 1), so the ::error:: line below fires instead
            # of an opaque "exit 1" without context.
            count=$(grep -cF "$marker" Dockerfile || true)
            [ "$count" = "1" ] || { echo "::error::expected 1 '$marker' sentinel, found $count"; exit 1; }
          done

      - name: claude-code-review draft gate and per-commit concurrency
        working-directory: /tmp/smoke-claude-review-on
        run: |
          # Both halves must survive the render, and neither announces its
          # absence: without the draft gate the reviewer decides eligibility
          # itself, mid-run, and loses a race against "Ready for review"
          # (template#437 — two full reviews of one diff); without the
          # SHA-keyed group two triggers on the same commit each run to
          # completion. A review that runs twice looks like a working review.
          grep -qF 'github.event.pull_request.draft == false' .github/workflows/claude-code-review.yml \
            || { echo "::error::claude-code-review.yml lost its workflow-level draft gate — the reviewer would race 'Ready for review' again"; exit 1; }
          grep -qF 'cancel-in-progress: true' .github/workflows/claude-code-review.yml \
            || { echo "::error::claude-code-review.yml lost its per-commit concurrency — the same commit can be reviewed twice"; exit 1; }
          grep -qE '^  group: claude-review-.*pull_request\.number.*pull_request\.head\.sha' .github/workflows/claude-code-review.yml \
            || { echo "::error::claude-code-review.yml's concurrency group no longer keys on the PR and head SHA, so it cannot dedupe per commit"; exit 1; }

      - name: release.yml marketplace upsert
        working-directory: /tmp/smoke
        run: |
          # Regression guard: upsert block must survive template renders.
          grep -qF '"git-subdir"' .github/workflows/release.yml \
            || { echo "::error::release.yml missing git-subdir marker — upsert regressed"; exit 1; }
          grep -qF '".claude-plugin/plugin"' .github/workflows/release.yml \
            || { echo "::error::release.yml missing .claude-plugin/plugin path — upsert regressed"; exit 1; }
          grep -qF 'any(.[]; .name == $name)' .github/workflows/release.yml \
            || { echo "::error::release.yml missing upsert branch — still silently no-ops on missing entry"; exit 1; }
          # The manifest path is the defect this guard missed once already
          # (template#383): the job wrote a root-level marketplace.json,
          # which Claude Code never reads, and every grep above still
          # passed.  Assert the only loadable location explicitly.
          grep -qF '.claude-plugin/marketplace.json' .github/workflows/release.yml \
            || { echo "::error::release.yml no longer targets .claude-plugin/marketplace.json — the catalog would be bumped at a path Claude Code does not read"; exit 1; }

      - name: publish-metadata gate (build backend vs the pinned publisher)
        # The metadata version the build backend emits and the twine the
        # publisher bundles are one invariant spread across two files, and
        # nothing asserted it.  This job builds wheels but never publishes
        # one, so a green gate here predicted nothing about `publish-pypi`
        # downstream: hatchling 1.32 began emitting `Metadata-Version: 2.5`,
        # the pinned action's twine 6.1.0 refused it, and the first signal
        # was a broken release in a consumer -- for every downstream at once,
        # at release time, stable and candidate alike (#479).
        #
        # `twine check` is offline and needs no credentials, so the invariant
        # costs a build and a file fetch to assert on the PR that moves
        # either pin, instead of on someone's release.
        #
        # One matrix leg only: the wheel is py3-none-any and twine's verdict
        # does not depend on the interpreter.
        if: matrix.python == '3.11'
        working-directory: /tmp/smoke
        run: |
          set -euo pipefail
          # Extract, never restate (#143/#159).  The twine that matters is
          # whichever one the PINNED action bundles, so read it out of that
          # pin.  Naming a version here would create a second pin that drifts
          # from the first -- the exact shape of the bug this step exists to
          # catch.  Reading the RENDERED release.yml keeps it honest about
          # what a downstream actually runs.
          SHA=$(grep -oE 'pypa/gh-action-pypi-publish@[0-9a-f]{40}' \
            .github/workflows/release.yml | head -1 | cut -d@ -f2 || true)
          [ -n "$SHA" ] \
            || { echo "::error::no pinned gh-action-pypi-publish SHA in rendered release.yml"; exit 1; }
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/pypa/gh-action-pypi-publish/${SHA}/requirements/runtime.txt" \
            -o /tmp/publisher-runtime.txt
          TWINE=$(grep -E '^twine==' /tmp/publisher-runtime.txt || true)
          PACKAGING=$(grep -E '^packaging==' /tmp/publisher-runtime.txt || true)
          [ -n "$TWINE" ] \
            || { echo "::error::no twine pin in the publisher's runtime.txt at $SHA"; exit 1; }
          [ -n "$PACKAGING" ] \
            || { echo "::error::no packaging pin in the publisher's runtime.txt at $SHA"; exit 1; }
          echo "publisher $SHA bundles $TWINE / $PACKAGING"
          # --out-dir keeps dist/ out of the shared render: later steps in
          # this job read that tree, and the detach smoke asserts on it.
          uv build --out-dir /tmp/publish-check
          uv run --no-project --with "$TWINE" --with "$PACKAGING" \
            twine check /tmp/publish-check/*

      - name: vale config structural check
        working-directory: /tmp/smoke
        run: |
          # Cheap sanity check on the rendered .vale.ini — catches
          # template breakage (empty file, missing Packages directive)
          # without paying the cost of a full vale sync+lint round.
          [ -f .vale.ini ] || { echo "::error::.vale.ini missing — render regressed"; exit 1; }
          grep -qE '^StylesPath\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing StylesPath directive"; exit 1; }
          grep -qE '^Packages\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing Packages directive"; exit 1; }
          grep -qE '^\[\*\.md\]$' .vale.ini \
            || { echo "::error::.vale.ini missing [*.md] section"; exit 1; }
          grep -qE '^BasedOnStyles\s*=' .vale.ini \
            || { echo "::error::.vale.ini missing BasedOnStyles directive"; exit 1; }

      - name: vale version pin lockstep
        working-directory: /tmp/smoke
        run: |
          # CI's vale-cli/vale-action `version:` and pre-commit's vale hook
          # `rev:` must stay in lockstep — drift means local pre-commit and
          # CI exercise different Vale binaries, so a finding visible to one
          # becomes silent to the other. Same discipline as the nfpm
          # lockstep enforced in PR #66.
          #
          # CI_VER extraction is scoped to the `vale:` job to avoid
          # accidentally matching a `version: "X.Y.Z"` if some other job
          # (e.g. setup-uv) ever moves off `version: "latest"` to a pinned
          # semver — that would silently extract the wrong pin and let real
          # drift slip through.
          CI_VER=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+version:/{print; exit}' .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          PC_VER=$(awk '/^[[:space:]]*-[[:space:]]*repo:.*vale-cli\/vale[[:space:]]*$/{f=1; next} f && /rev:/{print; exit}' .pre-commit-config.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          [ -n "$CI_VER" ] || { echo "::error::vale version pin not found in rendered ci.yml"; exit 1; }
          [ -n "$PC_VER" ] || { echo "::error::vale rev not found in rendered .pre-commit-config.yaml"; exit 1; }
          [ "$CI_VER" = "$PC_VER" ] \
            || { echo "::error::vale version drift — ci.yml=$CI_VER pre-commit=$PC_VER (bump in lockstep)"; exit 1; }

      - name: vale exclusion-scope lockstep
        working-directory: /tmp/smoke
        run: |
          # CI's vale_flags glob and pre-commit's exclude regex must scope to
          # the same subtrees. Drift means CI and pre-commit lint different file
          # sets — a finding visible to one is silent to the other.
          #
          # The two use different syntaxes for the same intent: the CI glob lists
          # subtrees as `{a,b,c}` (brace alternation, since Vale honors only one
          # --glob), while the pre-commit exclude is a regex `(a|b|c)`. So we
          # canonicalize each to a sorted set of subtree names under docs/ and
          # compare the sets, not the raw strings.
          #
          # CI extraction is scoped to the vale: job (same awk anchor as the
          # version check above) to avoid false matches on other vale_flags
          # values if a downstream adds a second Vale invocation.
          CI_EXCL=$(awk '/^  vale:/{f=1} f && /vale_flags:/{print; exit}' .github/workflows/ci.yml \
            | grep -oE '!docs/[^"'"'"' ]*' || true)
          # Bounded by the NEXT `- id:` rather than a fixed-size window. The
          # old form was `grep -A15`, and reviews on #159 and #209 both called
          # the 15 a magic number: if the vale hook block grows past it,
          # PC_EXCL comes back empty and the failure reads as misconfiguration
          # rather than a window too small. That headroom had already eroded
          # from the 4 lines #209 computed to 2 — the gap is 13 lines now, not
          # the 11 the old comment claimed. Bounding on the block's real end
          # retires the number instead of re-tuning it. The `$` anchor still
          # keeps `- id: vale` from matching `- id: vale-sync`.
          PC_EXCL=$(awk '
              /^[[:space:]]*-[[:space:]]*id:[[:space:]]*vale[[:space:]]*$/{f=1; next}
              f && /^[[:space:]]*-[[:space:]]*id:/{exit}
              f && /exclude:/{print; exit}' .pre-commit-config.yaml \
            | grep -oE 'docs/[^[:space:]]*' || true)
          [ -n "$CI_EXCL" ] || { echo "::error::vale exclusion glob not found in ci.yml vale_flags"; exit 1; }
          [ -n "$PC_EXCL" ] || { echo "::error::vale exclude not found in .pre-commit-config.yaml vale hook"; exit 1; }
          # Canonicalize to a sorted, comma-separated set of subtree names.
          # SPLIT FIRST, then normalize each element: drop {}/() grouping,
          # split on , or |, and only then strip a leading ! / ^, the docs/
          # prefix, and a trailing /** or /. Stripping before the split only
          # ever reached the first and last element, which was invisible while
          # the two compared forms happened to carry their `/**` once at the
          # end — mkdocs writes it per line (`design/**`, `decisions/**`), so
          # the old order left the inner ones un-stripped.
          canon() {
            echo "$1" \
              | tr -d '{}()' \
              | tr '|,' '\n' \
              | sed -E 's|^!||; s|^\^||; s|^docs/||; s|/\*\*$||; s|/+$||' \
              | grep -v '^$' \
              | sort | paste -sd, -
          }
          # Third surface: mkdocs `exclude_docs`. mkdocs.yml.jinja says "Keep
          # this set in lockstep with the Vale exclusion", and the #209 review
          # signed the design off as a "three-place lockstep (CI/pre-commit/
          # mkdocs) with CI enforcement" — but only two were ever compared, so
          # the one a reviewer already believed was covered was the one that
          # could drift silently. It is a block scalar of bare `subtree/**`
          # lines, so it needs no ! or docs/ prefix stripping; canon() handles
          # the trailing /** and the sort. `releases/next.md` is the one
          # deliberate exception: staging is excluded from published MkDocs,
          # but next.md is intentionally Vale-linted before release promotion.
          MK_VALE_EXCEPTIONS="releases/next.md"
          MK_RAW=$(awk '/^exclude_docs:/{f=1; next} f && /^[^[:space:]]/{exit} f' \
              mkdocs.yml \
            | tr -d ' ' | grep -v '^$' | paste -sd, - || true)
          [ -n "$MK_RAW" ] \
            || { echo "::error::exclude_docs block not found in the rendered mkdocs.yml — mkdocs.yml.jinja claims to be in lockstep with the Vale exclusion, so this must be extractable"; exit 1; }
          echo "$MK_RAW" | tr ',' '\n' | grep -qxF "$MK_VALE_EXCEPTIONS" \
            || { echo "::error::mkdocs exclude_docs lost the Vale-linted staging exception $MK_VALE_EXCEPTIONS"; exit 1; }
          MK_EXCL=$(echo "$MK_RAW" | tr ',' '\n' \
            | grep -vFx "$MK_VALE_EXCEPTIONS" | paste -sd, -)
          CI_NORM=$(canon "$CI_EXCL")
          PC_NORM=$(canon "$PC_EXCL")
          MK_NORM=$(canon "$MK_EXCL")
          # Assert what is actually compared. The -n guards above are on the
          # RAW extractions, but the equality tests below use the canonicalized
          # ones, and a non-empty raw value can canonicalize to empty (`!docs/`
          # reduces to nothing). Two empties compare equal, so the step would
          # pass vacuously — the same "prove you checked something" gap the
          # gate's linted-file-count readback closes one step over.
          for pair in "ci.yml:$CI_NORM" "pre-commit:$PC_NORM" "mkdocs:$MK_NORM"; do
            [ -n "${pair#*:}" ] \
              || { echo "::error::${pair%%:*} exclusion set canonicalized to empty — the raw value was non-empty, so the extraction matched something this canon() cannot read. Comparing it would pass vacuously."; exit 1; }
          done
          [ "$CI_NORM" = "$MK_NORM" ] \
            || { echo "::error::vale/mkdocs exclusion scope drift — ci.yml=$CI_EXCL ($CI_NORM) mkdocs exclude_docs=$MK_EXCL ($MK_NORM), after removing explicit Vale-only staging exceptions from $MK_RAW. A subtree excluded from the published site but linted by Vale (or the reverse) means the two disagree about what is user-facing prose."; exit 1; }
          [ "$CI_NORM" = "$PC_NORM" ] \
            || { echo "::error::vale exclusion scope drift — ci.yml=$CI_EXCL ($CI_NORM) pre-commit=$PC_EXCL ($PC_NORM)"; exit 1; }

      - name: vale pack-list lockstep
        # Same family as the two lockstep steps above, one surface further out.
        # `.vale.ini`'s `Packages =` is the source of truth for WHICH style
        # packs exist. Four other places enumerate them, and none can derive
        # the list at runtime:
        #
        #   1. this workflow's `cache vale style packs` path: — actions/cache
        #      takes no shell variable, so the list must stay literal
        #   2. the rendered ci.yml's `Cache Vale style packages` path: — same
        #      constraint, and it is what every downstream runs
        #   3. the rendered .pre-commit-config.yaml's `vale-sync` hook, which
        #      tests each pack directory to decide whether to sync
        #   4. `.vale.ini`'s own BasedOnStyles
        #
        # Nothing failed loudly when they diverged. Adding another pack to
        # `Packages` alone leaves both cache lists stale; leaves the
        # pre-commit hook blind to it, so a downstream's local `vale` run breaks
        # with no sync; and — if BasedOnStyles names a pack `Packages` never
        # fetches — makes vale exit `E100 [loadStyles]`, which the gate below
        # reports as "rendered prose must be clean": exactly the
        # packs-versus-prose misdiagnosis its `vale sync` guard exists to
        # prevent.
        #
        # So derive the set and assert all four enumerations equal it. The gate
        # step consumes the derived list via VALE_PACKS rather than becoming a
        # fifth — it uses it both for the cache-hit check and the pack copy.
        run: |
          set -euo pipefail
          VALE_INI=/tmp/smoke/.vale.ini
          [ -f "$VALE_INI" ] \
            || { echo "::error::$VALE_INI missing — render regressed"; exit 1; }
          # A Packages entry is either a registry name (`Google`, optionally
          # `Name@1.2.3`) or a URL to a .zip whose basename is the directory
          # `vale sync` creates under StylesPath. Reduce both to that name.
          #
          # Trailing `|| true` on every extraction pipeline below, including
          # this one: a zero-match grep exits 1, and under `pipefail` that
          # status propagates out of the command substitution, so `set -e`
          # would kill the step at the ASSIGNMENT — before the guard written to
          # diagnose exactly that case could print. #159 fixed this same shape
          # in the exclusion-scope step (the version-pin step was still
          # unguarded until this branch); every extraction here needs it, because
          # "extracted nothing" is the failure these guards exist to name.
          canon_packs() {
            tr ',' '\n' <<<"$1" \
              | sed -E 's#^[[:space:]]+##; s#[[:space:]]+$##; s#^.*/##; s#\.zip$##; s#@.*$##' \
              | grep -v '^$' | sort -u | paste -sd' ' - || true
          }
          # Appended to every drift message below. The rendered files each name
          # only the three surfaces that exist downstream — correct for their
          # reader, but a template maintainer needs the fourth, and the moment
          # they need it is when one of these assertions has just failed.
          SURFACES="All four surfaces that must match Packages =: .vale.ini BasedOnStyles; .github/workflows/ci.yml cache path:; .pre-commit-config.yaml vale-sync 'for p in'; and template-ci.yml's own 'cache vale style packs' path: (template repo only)."
          PACKS=$(canon_packs "$(sed -nE 's/^Packages[[:space:]]*=[[:space:]]*//p' "$VALE_INI")")
          [ -n "$PACKS" ] \
            || { echo "::error::no Packages entries extractable from the rendered .vale.ini"; exit 1; }

          # BasedOnStyles minus the built-in `Vale` style, which is always
          # available and has no package to fetch.
          BASED=$(canon_packs "$(sed -nE 's/^BasedOnStyles[[:space:]]*=[[:space:]]*//p' "$VALE_INI" \
            | sed -E 's/(^|,)[[:space:]]*Vale[[:space:]]*(,|$)/\1/')")
          [ "$BASED" = "$PACKS" ] \
            || { echo "::error::.vale.ini pack drift — BasedOnStyles=[$BASED] but Packages=[$PACKS]. A style in BasedOnStyles that Packages never fetches makes vale exit E100 [loadStyles]; a fetched pack no style uses is dead weight. $SURFACES"; exit 1; }

          # This workflow's own `cache vale style packs` path:, bounded to that
          # step by an anchored step-name match and the `key:` that ends the
          # list. The step name is anchored at both ends (`^      - name: …$`)
          # so this awk program's OWN line — same literal, but indented inside
          # a run: block — cannot start the scan early. Pack names are matched
          # only at line start, so the step's prose mention of
          # .vale/styles/config/ cannot match either.
          CACHED=$(awk '/^      - name: cache vale style packs$/{f=1} f && /^ *key:/{exit} f' \
              .github/workflows/template-ci.yml \
            | grep -oE '^[[:space:]]+/tmp/smoke/\.vale/styles/[A-Za-z0-9._-]+' \
            | sed -E 's#^.*/##' | sort -u | paste -sd' ' - || true)
          [ "$CACHED" = "$PACKS" ] \
            || { echo "::error::template-ci cache path drift — cached=[$CACHED] but .vale.ini Packages=[$PACKS]. A pack missing from that path: list is never restored, so the guarded sync below re-syncs every run and the cache stops working. Update the 'cache vale style packs' path: list. $SURFACES"; exit 1; }

          # The same enumeration in the RENDERED ci.yml. It drifts identically
          # and nothing else checks it, so a pack change that reaches downstream
          # with a stale cache list would otherwise be invisible here.
          DOWNSTREAM=$(awk '/^      - name: Cache Vale style packages$/{f=1} f && /^ *key:/{exit} f' \
              /tmp/smoke/.github/workflows/ci.yml \
            | grep -oE '^[[:space:]]+\.vale/styles/[A-Za-z0-9._-]+' \
            | sed -E 's#^.*/##' | sort -u | paste -sd' ' - || true)
          [ "$DOWNSTREAM" = "$PACKS" ] \
            || { echo "::error::rendered ci.yml cache path drift — cached=[$DOWNSTREAM] but .vale.ini Packages=[$PACKS]. Update the 'Cache Vale style packages' path: list in ci.yml.jinja. $SURFACES"; exit 1; }

          # The rendered pre-commit `vale-sync` hook decides whether to run
          # `vale sync` by testing each pack directory for existence. A pack it
          # does not know about is never seen as missing, so the hook stays
          # quiet and the `vale` hook right after it exits E100 on the
          # downstream's machine — the local mirror of the CI failure above.
          #
          # Anchored at BOTH ends and bounded by the next `- id:`, which is the
          # posture #159 established for the sibling extraction ~100 lines up.
          # Unanchored, `- id: vale-sync` also matches `- id: vale-sync-foo`;
          # unbounded, awk scans to EOF when the loop is reworded and captures
          # a later hook's `for p in`, reporting that hook's list as this one's.
          PRECOMMIT=$(canon_packs "$(awk '
              /^[[:space:]]*-[[:space:]]*id:[[:space:]]*vale-sync[[:space:]]*$/{f=1; next}
              f && /^[[:space:]]*-[[:space:]]*id:/{exit}
              f && /^[[:space:]]*for p in /{print; exit}' \
              /tmp/smoke/.pre-commit-config.yaml \
            | sed -E 's/^[[:space:]]*for p in //; s/;[[:space:]]*do[[:space:]]*$//' | tr ' ' ',')")
          [ "$PRECOMMIT" = "$PACKS" ] \
            || { echo "::error::rendered .pre-commit-config.yaml pack drift — vale-sync hook checks [$PRECOMMIT] but .vale.ini Packages=[$PACKS]. Update the 'for p in ...' list in .pre-commit-config.yaml.jinja. $SURFACES"; exit 1; }

          # Single source for the gate step's pack copy.
          echo "VALE_PACKS=$PACKS" >> "$GITHUB_ENV"
          echo "vale packs: $PACKS"

      - name: cache vale style packs
        # This cache is LOAD-BEARING, which took two attempts to get right.
        # A plain mirror of the rendered ci.yml's cache step does nothing:
        # `vale sync` never consults a cache, it wipes and re-creates every
        # directory named in `Packages =` on every invocation. Verified by
        # dropping canary files into .vale/styles/Google and
        # .vale/styles/ai-tells after a sync and syncing again — both gone. A
        # restored cache is therefore discarded before it is read unless the
        # sync itself is skipped, which is what the gate step below now does:
        # it syncs only when a pack directory is missing, exactly as the
        # vale-sync pre-commit hook decides.
        #
        # NO restore-keys, deliberately, and this is the #159 clobber in a new
        # place. With a guarded sync, a partial-key restore would hand the gate
        # a STALE pack set and then skip the sync that would have corrected it
        # — silently linting against the previous .vale.ini's packs. An exact
        # key only: change .vale.ini.jinja and the cache misses, so the sync
        # runs and re-resolves. The v2- prefix retires the v1- entries written
        # while the sync was still unconditional.
        #
        # The trade this accepts: `Packages =` lists the registry packs without
        # an @version, which .vale.ini.jinja calls intentional ("keeps style
        # rules current"). On a cache hit the gate now lints against the packs
        # as they were when the key was first written, not the latest release.
        # That is the point — it is what stops an upstream rule landing mid-PR
        # and failing a gate on prose nobody touched — but it means a rule
        # refresh happens when .vale.ini.jinja changes, not continuously.
        #
        # Only the downloaded pack directories, never .vale/styles/config/ —
        # that subtree is rendered from the template and must stay
        # authoritative, which is the clobber #159 documents. The path list is
        # asserted equal to the rendered .vale.ini's `Packages =` by the
        # lockstep step above.
        if: matrix.python == '3.11'
        uses: actions/cache@v6
        with:
          path: |
            /tmp/smoke/.vale/styles/Google
            /tmp/smoke/.vale/styles/proselint
            /tmp/smoke/.vale/styles/write-good
            /tmp/smoke/.vale/styles/ai-tells
          key: vale-styles-v2-${{ hashFiles('.vale.ini.jinja') }}

      - name: vale gate over the render
        # The structural check above proves .vale.ini renders; it has never
        # proved the rendered PROSE is clean. Every prose defect therefore
        # reached a downstream's own vale job first (#270).
        #
        # One matrix leg only: Vale's result does not depend on the Python
        # version, and `vale sync` is a network fetch.
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          # Extract, never restate (#143/#159): duplicated Vale configuration
          # drifts, and a finding visible to one surface goes silent in the
          # other. Same `vale:`-job awk anchor the two lockstep steps use.
          CI_YML=/tmp/smoke/.github/workflows/ci.yml
          # `|| true`: grep exits 1 on no match, and under set -e a failing
          # substitution kills the step before the guard below can say why
          # (#159 fixed this same shape in the exclusion-scope step).
          VER=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+version:/{print; exit}' "$CI_YML" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          FILES_JSON=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+files:/{print; exit}' "$CI_YML" \
            | sed -E "s/^[[:space:]]*files:[[:space:]]*'//; s/'[[:space:]]*$//")
          GLOB=$(awk '/^  vale:/{f=1} f && /vale_flags:/{print; exit}' "$CI_YML" \
            | sed -E 's/^[[:space:]]*vale_flags:[[:space:]]*"//; s/"[[:space:]]*$//')
          # Non-empty assertions matter more than the comparison: a future
          # ci.yml restructure that breaks an anchor would otherwise leave this
          # gate silently linting nothing and still reporting success.
          [ -n "$VER" ]  || { echo "::error::vale version not extractable from rendered ci.yml"; exit 1; }
          [ -n "$GLOB" ] || { echo "::error::vale_flags not extractable from rendered ci.yml"; exit 1; }
          mapfile -t FILES < <(echo "$FILES_JSON" | jq -er '.[]')
          [ "${#FILES[@]}" -gt 0 ] \
            || { echo "::error::vale files list not extractable from rendered ci.yml"; exit 1; }
          # vale_flags is plural: split it so a second flag does not arrive as
          # one argv element, which Vale would read as a path.
          read -ra VALE_FLAGS <<<"$GLOB"
          echo "gating on vale $VER over ${FILES[*]} with ${VALE_FLAGS[*]}"

          # CLAUDE.md's "Making changes" routine spells the same invocation out
          # for a human to paste, and calls itself a convenience copy — which
          # made it a restatement nothing checked, in the one file that also
          # calls itself "the only pre-push path". A stale copy there is the
          # #143 failure exactly: the maintainer's local run lints a narrower
          # set than this gate, so prose passes locally and fails here.
          # Single quotes are the shell quoting a human needs when pasting and
          # are not part of the value, so strip them before comparing.
          CLAUDE_CMD=$(grep -F 'vale --glob=' CLAUDE.md | head -1 \
            | tr -d "'" | sed -E 's/^[[:space:]]*//; s/[[:space:]]+$//' || true)
          [ -n "$CLAUDE_CMD" ] \
            || { echo "::error::no 'vale --glob=' command found in CLAUDE.md — the documented local routine no longer shows one, so it cannot be checked against this gate"; exit 1; }
          [ "$CLAUDE_CMD" = "vale ${VALE_FLAGS[*]} ${FILES[*]}" ] \
            || { echo "::error::CLAUDE.md's local Vale command drifted from the rendered ci.yml — CLAUDE.md=[$CLAUDE_CMD] but this gate runs [vale ${VALE_FLAGS[*]} ${FILES[*]}]. A maintainer following CLAUDE.md would lint a different set than CI."; exit 1; }

          # Checksum-verified, no sudo, run-scoped. #142 raised the unverified
          # download; the rendered ci.yml answered it with a SHA-pinned action.
          # The checksum here is a weaker answer and should not be read as an
          # equivalent one: it comes from the same release over the same
          # channel as the tarball, so it catches a truncated or corrupted
          # transfer, not a compromised release.
          #
          # errata-ai/vale was renamed to vale-cli/vale; both URLs still resolve
          # to the same release assets via GitHub's org redirect, but name it
          # the way ci.yml.jinja and .pre-commit-config.yaml.jinja already do so
          # all three agree if the redirect is ever retired.
          # Every command here is guarded, not just the checksum compare. The
          # asymmetry was the tell: the compare only runs once BOTH downloads
          # have succeeded, so it was the least likely to fire, while a 404
          # after a version bump produced `exit code 22` and no annotation at
          # all. Same diagnostic-loss class as the advisory block below.
          mkdir -p "$RUNNER_TEMP/valebin"
          TARBALL="vale_${VER}_Linux_64-bit.tar.gz"
          BASE="https://github.com/vale-cli/vale/releases/download/v${VER}"
          curl -sSfL -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL" \
            || { echo "::error::could not download $BASE/$TARBALL — vale $VER release asset missing or unreachable. The version comes from the rendered ci.yml, so check that pin first."; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$BASE/vale_${VER}_checksums.txt" \
            || { echo "::error::could not download the vale $VER checksums file from $BASE"; exit 1; }
          ( cd "$RUNNER_TEMP" && grep " $TARBALL\$" checksums.txt | sha256sum -c - ) \
            || { echo "::error::vale $VER tarball failed checksum verification"; exit 1; }
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/valebin" vale \
            || { echo "::error::vale $VER tarball has no 'vale' member at its root — release layout changed"; exit 1; }
          export PATH="$RUNNER_TEMP/valebin:$PATH"
          vale --version

          # Two variants, chosen for what they change in the LINTED set; see the
          # `authorization toggle-off render` step for why enable_authorization
          # and not the gate-off render. Both are rendered far above so they
          # pass through render hygiene while still pristine — this step must
          # consume those trees, never re-render one here.
          [ -d /tmp/smoke-authz-off ] \
            || { echo "::error::/tmp/smoke-authz-off missing — the authorization toggle-off render step did not run"; exit 1; }
          # One level up from the file-count readback below: that proves each
          # run linted something, this proves the SECOND run linted something
          # DIFFERENT.
          # The variant is only meaningful because smoke-answers.yml sets
          # enable_authorization: true while copier.yml defaults it to false —
          # flip that fixture line and `--data enable_authorization=false`
          # renders a tree identical to /tmp/smoke. The gate would then lint
          # the same prose twice, report two healthy file counts, and stay
          # green while claiming to cover a branch no other step sees.
          if diff -rq /tmp/smoke/docs /tmp/smoke-authz-off/docs >/dev/null 2>&1 \
             && diff -q /tmp/smoke/README.md /tmp/smoke-authz-off/README.md >/dev/null 2>&1; then
            echo "::error::/tmp/smoke-authz-off has the same linted prose as /tmp/smoke — enable_authorization no longer differs between them, so the second variant proves nothing. Check enable_authorization in tests/fixtures/smoke-answers.yml."
            exit 1
          fi
          # VALE_PACKS comes from the pack-list lockstep step, which derives it
          # from the rendered .vale.ini. Unquoted on purpose throughout: it is a
          # space-separated list and must word-split.
          [ -n "${VALE_PACKS:-}" ] \
            || { echo "::error::VALE_PACKS unset — the vale pack-list lockstep step did not run"; exit 1; }
          # Sync once and share the packs: the fetch is the expensive, network-
          # dependent part, and both renders resolve the same Packages line.
          #
          # Guarded so the cache step above is load-bearing rather than
          # decorative — `vale sync` wipes and re-creates every pack directory
          # unconditionally, so an unguarded sync discards whatever was
          # restored. Same decision the vale-sync pre-commit hook makes.
          #
          # The check is per-pack presence AND non-emptiness, not just `-d`.
          # An empty-but-present directory would satisfy `-d`, skip the sync,
          # and leave Vale to fail `E100 [loadStyles]` — which this step reports
          # as "rendered prose must be clean", the packs-versus-prose
          # misdiagnosis the whole design exists to avoid. Any pack failing
          # either test re-syncs all of them, since `vale sync` is all-or-
          # nothing regardless.
          #
          # A failed run cannot poison the cache under the exact key:
          # actions/cache creates an entry only "provided the job completes
          # successfully" (its README), which is why `save-always` had to exist
          # as a separate opt-in. A gate failure therefore saves nothing.
          MISSING=
          for PACK in $VALE_PACKS; do
            if [ ! -d "/tmp/smoke/.vale/styles/$PACK" ] \
               || [ -z "$(ls -A "/tmp/smoke/.vale/styles/$PACK" 2>/dev/null)" ]; then
              MISSING="$MISSING $PACK"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "syncing style packs (missing:$MISSING)"
            ( cd /tmp/smoke && vale sync >/dev/null ) \
              || { echo "::error::vale sync failed — style packs unavailable, not a prose failure"; exit 1; }
          else
            echo "all style packs restored from cache; skipping vale sync"
          fi
          for PACK in $VALE_PACKS; do
            # Load-bearing on an INFERRED fact: that `vale sync` names each
            # pack directory after the registry name or the .zip basename.
            # If an upstream ever repackages with a different top-level
            # directory, this is where it surfaces — and unguarded it would
            # surface as `cp: cannot stat`, a packs problem wearing no
            # annotation at all, in the one step whose whole design is that
            # packs failures must be distinguishable from prose failures.
            cp -r "/tmp/smoke/.vale/styles/$PACK" /tmp/smoke-authz-off/.vale/styles/ \
              || { echo "::error::vale sync did not create .vale/styles/$PACK — the Packages-entry-to-directory-name derivation no longer holds. This is a pack problem, not a prose problem."; exit 1; }
          done
          for RENDER in /tmp/smoke /tmp/smoke-authz-off; do
            OUT=$( cd "$RENDER" && vale "${VALE_FLAGS[@]}" "${FILES[@]}" 2>&1 ) || {
              echo "$OUT"
              echo "::error::vale reports errors in $RENDER — rendered prose must be clean"
              # Google/proselint/write-good are listed without an @version, so
              # a sync resolves them to whatever the registry serves that day
              # (.vale.ini.jinja calls that intentional). A rule added upstream
              # can therefore fail this gate on a PR that touched no prose, and
              # the message above would send the reader hunting through their
              # own diff.
              #
              # The guarded sync narrows this to cache misses only: on a hit the
              # packs are frozen at the vale-styles-v2-<hash> key and cannot
              # move under a PR. So key the hint on what actually happened this
              # run rather than asserting a refresh that mostly does not occur.
              if [ -n "$MISSING" ]; then
                echo "::notice::this run re-synced the style packs, so if the PR changed no prose suspect an upstream style-pack release — the registry packs carry no @version and resolve to the current release on a sync"
              else
                echo "::notice::style packs came from cache and are frozen at the vale-styles-v2 key, so an upstream pack release cannot explain this — the finding is in the rendered prose"
              fi
              exit 1
            }
            echo "$OUT"
            # A non-empty extraction is NOT proof this gate linted anything.
            # Verified empirically: `vale --glob='!**' docs README.md` prints
            # "0 errors ... in 0 files." and exits 0. So a `files` list or glob
            # that stays syntactically valid while matching nothing turns this
            # step green over an empty set — the silent degradation the
            # extraction is meant to prevent, wearing a passing checkmark.
            # Vale reports the count it actually examined; require it positive.
            LINTED=$(sed -nE 's/.*[^0-9]([0-9]+) files?\..*/\1/p' <<<"$OUT" | tail -1)
            [ -n "$LINTED" ] \
              || { echo "::error::could not read vale's file count for $RENDER — output format changed, so the linted-nothing guard is no longer effective"; exit 1; }
            [ "$LINTED" -gt 0 ] \
              || { echo "::error::vale linted 0 files in $RENDER — the extracted file set (${FILES[*]}) and glob (${VALE_FLAGS[*]}) match nothing, so this gate proved nothing"; exit 1; }
            echo "linted $LINTED files in $RENDER"
          done

          # Advisory. An accepted vocabulary term suppresses non-spelling rules
          # inside its match span, so the gate above can pass prose that still
          # carries a flagged pattern. Reported, not enforced: a downstream's
          # own legitimate vocabulary additions must not break template CI.
          #
          # "Advisory" has to hold for the block's own failures too. It runs
          # under this step's `set -euo pipefail`, so an unguarded `cp` here
          # would abort the step with a bare `cp: cannot stat …` and no
          # ::error::, AFTER the real gate has already passed — turning the
          # advisory into a red build with no diagnostic, the exact
          # diagnostic-loss shape #256 removed from this file. Both vocabulary
          # layers are emptied (the seeded Base list and the template-owned
          # Template list, #366); the paths are rename-sensitive literals:
          # check them, and trap so an abort between the emptying and the
          # restore cannot leave a vocabulary gutted for later steps.
          ( cd /tmp/smoke
            ACCS="$(printf '%s\n' .vale/styles/config/vocabularies/Base/accept.txt .vale/styles/config/vocabularies/Template/accept.txt)"
            mkdir -p "$RUNNER_TEMP/accept-bak"
            for f in $ACCS; do
              [ -f "$f" ] || { echo "::warning::$f not found — skipping the suppressed-findings advisory"; exit 0; }
              cp "$f" "$RUNNER_TEMP/accept-bak/$(echo "$f" | tr / _)"
            done
            trap 'for f in $ACCS; do cp "$RUNNER_TEMP/accept-bak/$(echo "$f" | tr / _)" "$f" 2>/dev/null || true; done' EXIT
            for f in $ACCS; do
              grep -E '^\s*(#|$)' "$RUNNER_TEMP/accept-bak/$(echo "$f" | tr / _)" > "$f" || true
            done
            STRICT=$(vale "${VALE_FLAGS[@]}" "${FILES[@]}" 2>&1 | grep -E '^ *[0-9]+:' | grep -vc 'Vale.Spelling' || true)
            if [ "$STRICT" != "0" ]; then
              echo "::warning::$STRICT non-spelling Vale finding(s) are suppressed by an accepted vocabulary term; re-run with both accept.txt files emptied to see them"
            fi ) || echo "::warning::the suppressed-findings advisory could not run; the gate above is unaffected"

      - name: detach smoke (FORKING.md commands produce a clean standalone state)
        working-directory: /tmp/smoke
        run: |
          # Mirrors the documented detach in the rendered FORKING.md. Runs LAST
          # because it mutates the tree in place; idempotence + gate already ran
          # on the pristine render. Asserts issue #182's Verification block.

          # --- Step 1: stop tracking ---
          rm -f .copier-answers.yml
          # --- Step 2: prune template-origin CI + fleet review wiring ---
          # claude-code-review.yml is optional; rm -f keeps this idempotent while
          # still removing it from an opted-in downstream.
          rm -f .github/workflows/copier-update.yml \
                .github/workflows/claude.yml \
                .github/workflows/claude-code-review.yml
          rm -f scripts/copier_update_notes.py
          rm -f scripts/migrate_agent_instructions.py
          rm -f scripts/report_seeded_changes.py .copier-seeded-changes.md
          rm -rf .agents/skills/applying-template-updates .claude/skills/applying-template-updates
          rm -f docs/deployment/template-updates.md
          sed -i.bak '/Template Updates: deployment\/template-updates.md/d' mkdocs.yml && rm -f mkdocs.yml.bak
          # --- Step 3 PREFLIGHT: every scrub anchor must exist, at the exact
          #     count the scrub expects (issue #199).
          #
          #     Without this the whole step passes VACUOUSLY whenever
          #     AGENTS.md.jinja is reworded and the scrub is not: the `sed`
          #     matches nothing, and the post-scrub "wording is gone"
          #     assertions still pass — because the wording is gone from the
          #     SOURCE, not because the scrub removed it. Source and scrub
          #     drift out of coupling in lockstep and CI stays green, so a real
          #     detach regression ships to forks undetected.
          #
          #     Asserting counts (not mere presence) also catches the reverse
          #     drift: a new section that adds a fourth ` Kept across copier
          #     update.` the scrub was never told about.
          #
          #     Counts must be bumped deliberately when AGENTS.md.jinja gains or
          #     loses one of these strings — that edit is exactly the moment to
          #     check FORKING.md's scrub still covers it.
          preflight_fail=0
          # `grep -oF | wc -l` counts OCCURRENCES, not matching lines as
          # `grep -c` would. Every anchor is one-per-line today, but the
          # "bump the count deliberately" model above only works if the number
          # means what a maintainer thinks it means — a future anchor twice on
          # one line would otherwise silently undercount and the drift guard
          # would pass. wc's leading padding is stripped so the string compare
          # below is exact.
          #
          # The trailing `|| true` is defensive, not currently load-bearing.
          # A zero-match grep exits 1, but this step has no `shell:` key, so
          # Actions runs it as `bash -e {0}` — WITHOUT pipefail, which is only
          # added for an explicit `shell: bash` — and the pipeline takes tr's
          # status (0). Should anyone add `shell: bash` or a `defaults.run`
          # shell later, pipefail would abort the step at the FIRST missing
          # anchor, killing the ::error:: diagnostics and the
          # accumulate-don't-stop behaviour both helpers rely on — precisely in
          # the drift case this step exists to report. `|| true` costs nothing
          # and makes the behaviour independent of that setting.
          # The scrub-anchor strings now live across AGENTS.md and the three
          # skills that carry template-tracked / copier-update prose after
          # the task-shaped sections moved out of AGENTS.md into portable
          # skills (#486): releasing (Release notes pages TEMPLATE-TRACKING
          # pair, the Dockerfile/stamp-manifests "preserved across" prose is
          # actually in config-contract — see below), config-contract, and
          # tool-registration (the Server Info Tool "block is preserved"
          # sentinel). Every check below counts OCCURRENCES across this
          # whole set, not just AGENTS.md, so a string that moved with its
          # section keeps being checked.
          # `.agents/skills/authoring-issues-prs/SKILL.md` is deliberately NOT
          # in this set: its copier-update wording matches none of the sed
          # rules below, so scrubbing it here would be a no-op that still
          # needs a real fix — tracked as a follow-up issue instead.
          SCRUB_FILES="AGENTS.md .agents/skills/releasing/SKILL.md .agents/skills/config-contract/SKILL.md .agents/skills/tool-registration/SKILL.md docs/deployment/release-process.md"
          count_occurrences() {
            cat $SCRUB_FILES | grep -oF "$1" | wc -l | tr -d '[:space:]' || true
          }
          check_anchor() {
            actual=$(count_occurrences "$2")
            if [ "$actual" != "$1" ]; then
              echo "::error::scrub-anchor drift: expected $1 occurrence(s) of '$2' across the rendered scrub file set ($SCRUB_FILES), found $actual. AGENTS.md.jinja or a skill it fed was reworded without updating the detach scrub (FORKING.md + this workflow) — fix the scrub, or bump the expected count here if the change is intentional."
              preflight_fail=1
            fi
          }
          # 4: two pairs in AGENTS.md, one in the releasing skill, one around
          # the release-process page's link to the template-updates page.
          check_anchor 4 '<!-- TEMPLATE-TRACKING-START -->'
          check_anchor 4 '<!-- TEMPLATE-TRACKING-END -->'
          # The Skills bullet for the copier-only skill; the skill itself is
          # removed in Step 2, so the bullet goes with it.  The anchor starts
          # at the backtick: count_occurrences passes it to `grep -F` bare,
          # and a leading `- ` would be read as an option.
          check_anchor 1 '`applying-template-updates` — when working through'
          check_anchor 1 '<!-- ===== TEMPLATE-OWNED SECTIONS BELOW'
          check_anchor 1 '<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->'
          check_anchor 3 ' Kept across copier update.'
          check_anchor 1 ' on top of the shipped defaults survive `copier update`.'
          # 2: the `Dockerfile` sentinels and the `scripts/stamp_manifests.py`
          # DOMAIN-MANIFESTS sentinels (#325).
          check_anchor 2 ' are preserved across `copier update`.'
          check_anchor 2 'The block is preserved across `copier update`.'
          check_anchor 1 ' on every `copier copy`/`copier update` and re-verified by'
          [ "$preflight_fail" = "0" ] \
            || { echo "::error::detach scrub is no longer coupled to AGENTS.md.jinja — see the scrub-anchor drift errors above"; exit 1; }

          # --- Step 3: scrub template-tracking + copier-update wording ---
          # -i.bak + rm mirrors FORKING.md's portable form (GNU + BSD sed).
          # Runs over every file in $SCRUB_FILES: AGENTS.md still carries the
          # PR-Discipline and Shared-Infrastructure TEMPLATE-TRACKING pairs,
          # while the release, config-contract, and tool-registration skills
          # carry the rest of the copier-update wording since #486 moved
          # those sections out of AGENTS.md.
          for f in $SCRUB_FILES; do
            sed -i.bak \
              -e '/<!-- TEMPLATE-TRACKING-START -->/,/<!-- TEMPLATE-TRACKING-END -->/d' \
              -e '/<!-- ===== TEMPLATE-OWNED SECTIONS BELOW/d' \
              -e '/<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->/d' \
              -e '/^- `applying-template-updates` — /d' \
              -e 's/ Kept across copier update\.//' \
              -e 's/ on top of the shipped defaults survive `copier update`\./ on top of the shipped defaults are yours to maintain./' \
              -e 's/ are preserved across `copier update`\./ are domain-owned./' \
              -e 's/The block is preserved across `copier update`\./The block is domain-owned./' \
              -e 's| on every `copier copy`/`copier update` and re-verified by| whenever config fields change, and re-verified by|' \
              "$f" && rm -f "$f.bak"
          done
          # --- Closing ("You are now standalone"): remove the detach guide.
          #     FORKING.md's numbered Step 4 (README cleanup) is intentionally
          #     NOT mirrored here — it mutates README prose this smoke does not
          #     assert (a documented spec non-goal).
          rm -f FORKING.md

          # --- assert the detached state ---
          [ ! -f .copier-answers.yml ] \
            || { echo "::error::.copier-answers.yml still present after detach"; exit 1; }
          [ ! -f FORKING.md ] \
            || { echo "::error::FORKING.md not removed by detach"; exit 1; }
          ! grep -rn "copier" .github/ \
            || { echo "::error::copier reference remains under .github/ after detach"; exit 1; }
          # The first three tokens are issue #182's literal Verification block;
          # the last two ("lives upstream", "propagate here via copier update")
          # are actual prose inside the scrubbed TEMPLATE-TRACKING range, so this
          # grep bites on a regressed scrub rather than passing vacuously.
          # Checked across the whole $SCRUB_FILES set, not just AGENTS.md,
          # since the release/config-contract/tool-registration skills now
          # carry some of that scrubbed prose (#486).
          ! grep -rniE "fleet|downstream conforms|shape lives in pvl-core|lives upstream|propagate here via .?copier update" $SCRUB_FILES \
            || { echo "::error::template-tracking language remains in the scrub file set after scrub"; exit 1; }
          # A detached fork must not claim its sections are overwritten or
          # preserved by copier update (issue #184). The scrub strips every
          # such mention (banner fences, DOMAIN "Kept across" notes,
          # "preserved/survive across copier update" prose), so none may
          # remain anywhere in $SCRUB_FILES.
          ! grep -niF 'copier update' $SCRUB_FILES \
            || { echo "::error::copier-update wording remains in the scrub file set after detach scrub"; exit 1; }
          grep -qE '^## Shared Infrastructure$' AGENTS.md \
            && { echo "::error::Shared Infrastructure section survived the scrub"; exit 1; } || true
          grep -qE '^## Contributing fixes upstream$' AGENTS.md \
            && { echo "::error::Contributing fixes upstream section survived the scrub"; exit 1; } || true
          grep -qF 'Automatic agent review is disabled' AGENTS.md \
            && { echo "::error::automatic-review tracking guidance survived the scrub"; exit 1; } || true
          grep -qE '^## Release notes pages$' .agents/skills/releasing/SKILL.md \
            && { echo "::error::Release notes pages section survived the scrub"; exit 1; } || true
          grep -qE '^## Template updates$' docs/deployment/release-process.md \
            && { echo "::error::Template updates section survived the scrub"; exit 1; } || true
          grep -qE '^## Where to read about a release$' docs/deployment/release-process.md \
            || { echo "::error::release-process page lost '## Where to read about a release' — scrub deleted too much"; exit 1; }
          [ ! -e docs/deployment/template-updates.md ] \
            || { echo "::error::template-updates page not removed by detach"; exit 1; }
          [ ! -e .claude/skills/applying-template-updates ] \
            || { echo "::error::applying-template-updates symlink not removed by detach"; exit 1; }
          ! grep -q 'applying-template-updates' AGENTS.md \
            || { echo "::error::AGENTS.md still advertises the applying-template-updates skill after detach"; exit 1; }
          ! grep -q 'template-updates.md' mkdocs.yml \
            || { echo "::error::mkdocs.yml nav still lists the removed template-updates page after detach"; exit 1; }
          # The detached docs must still build strictly: a dangling nav entry
          # or a link to a removed page is exactly what a fork's docs.yml
          # would fail on next.  The venv from the gate above is reused.
          uv run mkdocs build --strict -q \
            || { echo "::error::mkdocs build --strict fails on the detached tree"; exit 1; }
          # The releasing skill's own TEMPLATE-TRACKING pair (pair 2) has no
          # over-run guard from the AGENTS.md kept-section loop below, since
          # that loop only ever checks AGENTS.md. Guard it here instead: the
          # pair is the LAST section in releasing/SKILL.md, so only the
          # heading immediately ABOVE its START marker needs a must-survive
          # assertion — there is no heading below the END marker to lose.
          grep -qE '^## Release machinery' .agents/skills/releasing/SKILL.md \
            || { echo "::error::releasing skill lost '## Release machinery' — scrub deleted too much above the TEMPLATE-TRACKING pair"; exit 1; }
          # Neutral guidance must remain. The scrub is a sed range-delete, so the
          # only "deleted too much" failure mode (given the pristine-render
          # marker-count guard already holds 2 balanced pairs in AGENTS.md plus
          # 1 in the releasing skill) is a misplaced marker that swallows a
          # section adjacent to one of the three pairs' boundaries (#486 moved
          # the Release notes pages TEMPLATE-TRACKING pair, and the Logging
          # Standard, Config & Customization Contract, Server Info Tool, and
          # Tool Registration Checklist sections it used to sit between, into
          # the releasing / config-contract / tool-registration skills —
          # checked separately via $SCRUB_FILES above). Pair 1 (PR Discipline)
          # and pair 3 (Shared Infrastructure) live in AGENTS.md; pair 2
          # (Release notes pages) lives in the releasing skill, guarded just
          # above. Every boundary is bracketed by a must-survive assertion:
          #   pair 1 START → ## PR Discipline (above, in AGENTS.md)
          #   pair 1 END   → ## GitHub Review Types (below, in AGENTS.md)
          #   pair 2 START → ## Release machinery (above, in the releasing
          #                  skill — asserted just above; the pair is the
          #                  last section in that file, so there is no
          #                  below-boundary heading to guard)
          #   pair 3 START → ## Documentation Discipline / Documentation
          #                  Conventions sections (above, in AGENTS.md)
          #   pair 3 END   → ## Key Design Decisions (below, in AGENTS.md;
          #                  the TEMPLATE-OWNED END fence that used to sit
          #                  here is removed by the scrub, so ## Key Design
          #                  Decisions is now the sole below-the-boundary
          #                  over-run guard)
          # The remaining entries are the other sections FORKING.md promises survive.
          for kept_section in \
              '^## Conventions$' \
              '^## Breaking Changes and the' \
              '^## Hard PR Acceptance Gates$' \
              '^## PR Discipline$' \
              '^## GitHub Review Types$' \
              '^## Documentation Discipline$' \
              '^## Documentation Conventions' \
              '^## Key Design Decisions$'; do
            grep -qE "$kept_section" AGENTS.md \
              || { echo "::error::neutral section '$kept_section' lost — scrub deleted too much"; exit 1; }
          done
          # The TEMPLATE-OWNED banner fences are intentionally removed by the
          # scrub (a detached fork owns every section), so assert both are gone.
          # The range-delete's bottom-boundary over-run guard is now
          # '## Key Design Decisions' (asserted in the kept-section loop above):
          # it sits below where the END fence was, so a range delete that ran to
          # EOF past pair 3 would drop it too.
          #
          # Asserted as TWO independent fixed-string checks, each using the same
          # literal its own `sed` -e deletes (issue #199). The previous single
          # alternation '^<!-- ===== TEMPLATE-OWNED SECTIONS (BELOW|END)' shared a
          # prefix with both fences, so it could not distinguish "the END fence
          # was deleted" from "the END fence was renamed and now neither the sed
          # nor this regex matches it" — the delete and its check failed
          # together instead of independently.
          ! grep -qF '<!-- ===== TEMPLATE-OWNED SECTIONS BELOW' AGENTS.md \
            || { echo "::error::TEMPLATE-OWNED BELOW banner fence survived the detach scrub"; exit 1; }
          ! grep -qF '<!-- ===== TEMPLATE-OWNED SECTIONS END ===== -->' AGENTS.md \
            || { echo "::error::TEMPLATE-OWNED END banner fence survived the detach scrub"; exit 1; }

          # --- the substitutions PRODUCED their replacement text ---
          # Absence of the old wording is not proof the scrub ran — the wording
          # could simply never have been there (issue #199, vector 2). Assert the
          # REPLACEMENT text the s/// commands emit, which can only appear if the
          # substitution actually fired. Counts mirror the preflight anchors.
          # Accumulates like check_anchor rather than exiting on the first
          # mismatch: if several substitutions silently fail to fire, one CI
          # run should name all of them, not send the maintainer round the
          # loop once per substitution.
          replacement_fail=0
          check_replacement() {
            actual=$(count_occurrences "$2")
            if [ "$actual" != "$1" ]; then
              echo "::error::detach scrub substitution did not fire: expected $1 occurrence(s) of '$2' after the scrub, found $actual"
              replacement_fail=1
            fi
          }
          check_replacement 1 ' on top of the shipped defaults are yours to maintain.'
          check_replacement 2 ' are domain-owned.'
          check_replacement 2 'The block is domain-owned.'
          check_replacement 1 ' whenever config fields change, and re-verified by'
          [ "$replacement_fail" = "0" ] \
            || { echo "::error::detach scrub ran but did not produce its replacement text — see the errors above"; exit 1; }
          # stripped files gone (claude-code-review.yml is optional before detach):
          for gone in \
              .github/workflows/copier-update.yml \
              .github/workflows/claude.yml \
              .github/workflows/claude-code-review.yml \
              scripts/copier_update_notes.py \
              scripts/migrate_agent_instructions.py \
              scripts/report_seeded_changes.py; do
            [ ! -e "$gone" ] \
              || { echo "::error::$gone not removed by detach"; exit 1; }
          done
          # kept files present:
          for kept in \
              .github/workflows/ci.yml \
              .github/workflows/codeql.yml \
              .github/workflows/coverage-status.yml \
              .github/workflows/docs.yml \
              .github/workflows/release-prepare.yml \
              .github/workflows/release.yml \
              .github/workflows/release-notes-publish.yml; do
            [ -f "$kept" ] \
              || { echo "::error::$kept was removed but should be kept"; exit 1; }
          done
          echo "detach smoke passed"

  # Runs the two downstream workflow shapes that generated projects invoke
  # on their own CI — `mkdocs build --strict` (docs.yml) and `nfpm package`
  # (release.yml).  Dedicated non-matrix job so the downstream-gate is
  # decoupled from whichever Python versions render-and-gate's matrix rotates
  # through.  nfpm pinned to the same version as release.yml.jinja so a
  # template-ci pass genuinely implies a downstream-CI pass for this shape.
  downstream-gate:
    name: Downstream workflow gate (docs + packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Render smoke project with copier
        run: |
          uv run --no-project --with copier \
            copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file tests/fixtures/smoke-answers.yml \
            . /tmp/smoke

      - name: Install rendered project (with all extras and groups)
        working-directory: /tmp/smoke
        run: uv sync --all-extras --all-groups

      - name: Install nfpm
        # Pin matches release.yml.jinja so we exercise the same version
        # downstream projects will use.  Bump both in lockstep.
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: mkdocs build --strict
        working-directory: /tmp/smoke
        run: uv run mkdocs build --strict

      - name: nfpm package (deb)
        working-directory: /tmp/smoke
        run: |
          mkdir -p dist
          VERSION=0.0.0 ARCH=amd64 nfpm package --packager deb --target dist/ --config packaging/nfpm.yaml

      - name: nfpm package (rpm)
        working-directory: /tmp/smoke
        run: |
          mkdir -p dist
          VERSION=0.0.0 ARCH=amd64 nfpm package --packager rpm --target dist/ --config packaging/nfpm.yaml

      - name: docker build smoke
        # Catches Dockerfile structural regressions (base-image drift,
        # broken multi-line RUN chains, missing ENTRYPOINT/CMD/USER).
        working-directory: /tmp/smoke
        run: docker build --no-cache --progress=plain -t smoke-mcp-ci .

      - name: docker run smoke (verify state dirs + ownership)
        # Catches in-RUN sentinel-comment regressions: if a future Dockerfile
        # parser ever passed `#` lines through to the shell, the joined
        # `\\`-continuation would treat the DOCKERFILE-STATE-DIRS sentinel
        # as a shell comment and silently drop the mkdir/chown — but
        # `useradd` is the last preceding command and exits 0, so the build
        # itself would succeed. Verifying the directories exist and are
        # appuser-owned at runtime is what makes the sentinel guarantee
        # actually testable.
        run: |
          docker run --rm --entrypoint /bin/sh smoke-mcp-ci -c '
            stat -c "%U" /data/service | grep -qx appuser &&
            stat -c "%U" /data/state/fastmcp | grep -qx appuser
          '

  update-regression:
    name: Copier-update keeps domain vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check renders a released tag from a fresh clone of this
          # checkout, and copier describes HEAD against tags to order the
          # update — both need full history and the release tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run the copier-update regression check
        # Guards the update-time generation ordering: renders v3.0.2,
        # injects a domain var, commits, `copier update`s to HEAD, and
        # asserts the var survived in the generated artifacts (the
        # pre-#302 task ordering silently stripped it).
        run: python3 scripts/check_update_regression.py

  scripts-and-invariants:
    # Covers scripts/ generally: the unit tests, UPGRADING.md's invariants,
    # and the lint/format/structural gates that mirror what a downstream
    # runs. Named for that rather than for the copier-update aggregator it
    # once tested, which was removed in #457 (#458).
    #
    # The display name is a status-check context, and this repo's branch
    # protection is hand-managed (CLAUDE.md, "Repository protection"), so a
    # rename here is only safe while the old context is not in the required
    # set. It was not when this landed. Re-check before renaming it again.
    name: Template scripts and invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run script unit tests
        # Install the core at exactly the constraint the template renders
        # (pyproject.toml.jinja): the generator's fixtures assert core help
        # text, and an unbounded install picked up 5.0.0 the day it shipped
        # and turned main red (#509).  Reading the constraint out of the
        # template keeps floor and cap in lockstep without a second copy.
        run: |
          # Quoted form only, so a rationale comment naming the package can never win.
          CORE=$(grep -oE '"fastmcp-pvl-core>=[^"]*"' pyproject.toml.jinja | head -1 | tr -d '"')
          [ -n "$CORE" ] || { echo "::error::no fastmcp-pvl-core constraint in pyproject.toml.jinja"; exit 1; }
          echo "core constraint: $CORE"
          uv run --with pytest --with pyyaml --with jsonschema --with jinja2 --with copier --with "$CORE" pytest scripts/tests/ -v

      - name: UPGRADING.md Unreleased section
        run: |
          # Two halves, and each is silent without the other. The invariants
          # (at most one `## Unreleased`, and it is last) keep a second
          # section from accumulating above already-released ones, where the
          # release would strand it. The invocation check keeps the promotion
          # step itself from being dropped: the script and its tests would
          # stay green while every release quietly left the section behind —
          # the same coupling the manifest stamper's invocation is gated on.
          python3 scripts/promote_upgrading.py --check
          grep -qF 'scripts/promote_upgrading.py --version' .github/workflows/template-release.yml \
            || { echo "::error::template-release.yml no longer promotes UPGRADING.md's Unreleased section — releases would ship it unpromoted"; exit 1; }
          grep -qE '^\s+git add .*UPGRADING\.md' .github/workflows/template-release.yml \
            || { echo "::error::template-release.yml promotes UPGRADING.md but never stages it — the rewrite would be discarded"; exit 1; }

      - name: Lint scripts (ruff check matching downstream's config)
        # Mirror the rendered project's [tool.ruff.lint] block in
        # pyproject.toml.jinja: same `select` list, same `ignore = ["E501"]`,
        # same line-length 88. Catch regressions here before they surface in
        # downstream CI on the next copier-update.
        run: |
          uv run --with ruff ruff check \
            --select E,W,F,I,B,C4,UP,ARG,SIM,TC,PTH,RUF \
            --ignore E501 \
            --line-length 88 \
            --target-version py311 \
            scripts/copier_update_notes.py scripts/check_render_hygiene.py scripts/check_update_regression.py scripts/gen_config_surface.py scripts/check_pins.py scripts/report_seeded_changes.py scripts/promote_release_notes.py scripts/promote_upgrading.py scripts/tests/

      - name: Format check scripts (ruff format matching downstream)
        run: |
          uv run --with ruff ruff format --check --line-length 88 --target-version py311 \
            scripts/copier_update_notes.py scripts/check_render_hygiene.py scripts/check_update_regression.py scripts/gen_config_surface.py scripts/check_pins.py scripts/report_seeded_changes.py scripts/promote_release_notes.py scripts/promote_upgrading.py scripts/tests/

      - name: Structural gate on shipped scripts (matches downstream diff-gate)
        # The scripts that render into every project (gen_config_surface.py,
        # copier_update_notes.py, promote_release_notes.py) must satisfy the SAME structural rules
        # the downstream diff-gate enforces (AGENTS.md gate #5 / the `structure`
        # job): C901 + the PLR complexity family + S. The `Lint scripts`
        # step above intentionally mirrors only the base whole-repo `select`,
        # which omits these — so a complexity regression in a shipped script
        # (e.g. #303: `_unscanned_from_env_reads` reaching C901's 11 > 10) used
        # to ship green and then fail the diff-gate on the very `copier update`
        # that delivered it, in a downstream whose own diff was clean. This
        # gate runs whole-file (the template ships the whole script, not a
        # diff) with the same per-file `S606` ignore the rendered
        # pyproject.toml carries, so it matches exactly what a downstream sees.
        # Template-only scripts (scripts/tests/, check_render_hygiene.py,
        # check_update_regression.py) are excluded from render and so omitted.
        #
        # The thresholds are pinned explicitly to the same values
        # pyproject.toml.jinja's `[tool.ruff.lint.mccabe]` / `[...pylint]`
        # blocks set. They equal ruff's current defaults, so this repo (which
        # has no root pyproject/ruff.toml) would apply them by fallback anyway
        # — but pinning keeps the template-side gate from silently diverging
        # from the downstream gate if a future ruff changes those defaults.
        run: |
          uv run --with ruff ruff check \
            --select C901,PLR0911,PLR0912,PLR0913,PLR0915,S \
            --per-file-ignores "scripts/gen_config_surface.py:S606,scripts/promote_release_notes.py:S603,scripts/promote_release_notes.py:S607,scripts/check_pins.py:S310,scripts/report_seeded_changes.py:S603,scripts/report_seeded_changes.py:S606,scripts/report_seeded_changes.py:S607" \
            --config "lint.mccabe.max-complexity=10" \
            --config "lint.pylint.max-args=5" \
            --config "lint.pylint.max-branches=12" \
            --config "lint.pylint.max-returns=6" \
            --config "lint.pylint.max-statements=50" \
            --line-length 88 \
            --target-version py311 \
            scripts/gen_config_surface.py scripts/copier_update_notes.py scripts/promote_release_notes.py scripts/check_pins.py scripts/report_seeded_changes.py

  pr-title:
    name: PR Title
    # The template dogfoods the check it ships. Its own release notes are
    # built from merged pull-request titles verbatim (see the "Collect merged
    # PR titles since latest tag" step in template-release.yml), so the same
    # discipline applies here — and a check nobody runs on the repo that
    # authors it is a check nobody trusts.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check pull-request title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Reads the CURRENT title rather than the event payload's, so a
        # re-run after a retitle clears the check without a push.
        run: |
          set -euo pipefail
          TITLE="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .title)"
          python3 scripts/check_pr_title.py "$TITLE"
