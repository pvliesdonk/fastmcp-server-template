name: Renovate (template)

# Self-hosted Renovate for THIS template repo. Scans the real workflows via the
# native github-actions manager AND the Jinja-templated workflows via the
# custom.regex manager in .github/renovate.json — catching GitHub Action MAJOR
# updates that Dependabot cannot see (Dependabot can't parse *.jinja). Opens PRs
# for human review; never auto-merges. Downstream inherits Action bumps through
# a template release + copier update, not through per-repo Dependabot.

on:
  schedule:
    # Every 4 hours, 7 minutes past to sidestep GitHub's top-of-hour delay.
    # Nothing in .github/renovate.json is schedule-gated and nothing
    # automerges, so cadence here only bounds how long an Action bump waits
    # for its PR (runs take ~2 min on RELEASE_TOKEN).  The downstream runner
    # (renovate.yml.jinja) has its own, window-driven reason for the same cron.
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        # Exact pin: renovatebot/github-action publishes no floating major tag
        # (a bare @v46 does not resolve and fails the job before any step).
        # v46.x bundles a Renovate CLI well past the >=43.59.0 floor (fixes the
        # PEP 735 [dependency-groups] depName bug); do not pin an older renovate-version.
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RELEASE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
