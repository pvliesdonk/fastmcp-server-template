# SonarQube Cloud analysis of this template repository itself, read by the
# `sonar` job in template-ci.yml.  Never rendered: generated projects get
# sonar-project.properties.jinja, which copier gives precedence.
# Automatic Analysis is off in the SonarQube Cloud project, so that job is
# the template's only analysis.
sonar.organization=pvliesdonk
sonar.projectKey=pvliesdonk_fastmcp-server-template

# The whole repository is the source; the template's .jinja files are not a
# language the scanner reads, so what it analyses is the Python under
# scripts/, the plain workflows and the other non-template files.
# scripts/tests/ and tests/ (the verbatim tests a render ships) are test code.
sonar.sources=.
sonar.tests=scripts/tests,tests
sonar.exclusions=scripts/tests/**,tests/**

sonar.python.version=3.11, 3.12, 3.13, 3.14

# Coverage comes from template-ci's script unit tests, measuring scripts/ and
# the build-plugin-zip action ([tool.coverage.run] in pyproject.toml).  Every
# other Python file is excluded from coverage, still analysed for issues.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/tests/**,tests/**,docs/**,src/**,packaging/**
