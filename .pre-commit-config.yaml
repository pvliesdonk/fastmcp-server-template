repos:
  - repo: local
    hooks:
      # Both ruff hooks read the root ruff.toml, the same rule set
      # template-ci's lint and format steps apply (#568); a hook failure
      # therefore means the change violates something the project enforces,
      # not whatever the installed ruff enables by default this month.
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]
        pass_filenames: true

      # Type-check the template's OWN Python (scripts/).  The generated
      # project's src/ is unrendered Jinja here and cannot be mypy'd locally;
      # template-ci.yml renders the template and runs `mypy src/ tests/` on
      # the rendered output — that command never touches scripts/, so this
      # hook and template-ci's "Type-check scripts (mypy)" step are the only
      # mypy coverage gen_config_surface.py gets.
      #
      # mypy, the PyYAML/jsonschema stubs and fastmcp-pvl-core come from the
      # repository's locked tooling environment (pyproject.toml + uv.lock at
      # the root, #694), so every import resolves and no blanket
      # --ignore-missing-imports is needed.
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        files: ^scripts/
        pass_filenames: false
        args: [scripts/]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
