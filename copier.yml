# Copier configuration for fastmcp-server-template.
#
# Spec: docs/superpowers/specs/2026-04-20-fastmcp-copier-scaffold-design.md
# (markdown-vault-mcp repo).

# 9.4 floor: `_copier_operation` (used to gate the config-surface task to
# `copier copy`) entered the task-rendering context in copier 9.4.0, and the
# plain-string `_migrations` form with its default after-stage condition is
# also a 9.x-line feature the update-time regeneration relies on.
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# Post-generation tasks.
#
# 1. Vendor the MCP Apps SDK into static/app.html.  The task value is
#    Jinja-rendered; it collapses to an empty string (skipped) for non-apps
#    projects — regenerates app.html from the project's (possibly customized)
#    app.src.html.  Requires network (downloads @modelcontextprotocol/ext-apps).
#    Both CI paths pass --trust.  Runs on `copier copy` AND `copier update`:
#    its input (app.src.html) is `_skip_if_exists`, so the update never
#    replaces it and the mid-update run sees the project's real source.
# 2. Generate the config-surface artifacts (.env.example, packaging/env.example,
#    examples/*.env, docs/javascripts/config-wizard/wizard-spec.json) from
#    fastmcp_pvl_core.server_config_surface() plus config-presentation.yml /
#    config-presentation.domain.yml.  Plain `python` (not `uv run`) is correct
#    here: copier's `_tasks` run before any virtualenv exists for a freshly
#    rendered project, so `scripts/gen_config_surface.py` self-bootstraps under
#    `uv run --no-project` (pinning fastmcp-pvl-core and PyYAML ad hoc) when
#    those two aren't importable in the interpreter running this task — a
#    version pin here would drift from the floor in pyproject.toml. That
#    self-bootstrap must never create a persistent virtualenv, since
#    template-ci renders the template twice and diffs the results.
#
#    Runs on `copier copy` ONLY.  On `copier update`, `_tasks` execute after
#    template-owned files are re-rendered but BEFORE the old-render → project
#    diff restores the domain content — so config.py is the domain-less
#    skeleton at that moment, and a mid-update run would rewrite every
#    (skip-listed, hence never-patched) artifact with the domain vars
#    stripped, silently.  The `_migrations` entry below is the update-time
#    counterpart: after-stage migrations run at the very end of the update,
#    once the diff has restored config.py.
_tasks:
  - "{% if include_mcp_apps_scaffold %}python scripts/vendor_spa.py{% endif %}"
  - "{% if _copier_operation == 'copy' %}python scripts/gen_config_surface.py{% endif %}"

# Update-time regeneration of the config-surface artifacts.  A plain-string
# migration entry carries copier's default condition `_stage == "after"` and
# no version constraint, so it runs on EVERY `copier update`, after the
# old-render → project diff has been applied — i.e. against the project's
# restored config.py, where domain discovery actually sees the domain
# fields.  Migrations never run on `copier copy`; the `_tasks` entry above
# covers that path.
_migrations:
  - "python scripts/gen_config_surface.py"

# Starter files: written once on first `copier copy`, protected from
# `copier update`.  Domain-owned — users customise these and keep their
# edits across template updates.
#
# NOTE: `_skip_if_exists` only preserves files that *already exist* at
# destination; it does NOT protect against re-creation on projects that
# never had the file.  For scaffold files that a retrofitted project
# might legitimately skip (different docs layout etc.), add the path to
# `_exclude` below instead of here.
#
# The four `src/{python_module}/{tools,resources,prompts,domain}.py`
# scaffolds + `tests/test_smoke.py` stay in `_skip_if_exists` because
# the template-owned `server.py` / `_server_deps.py` import from them
# and the template CI gate (`pytest -x -q`) needs at least one test to
# collect.  Retrofitted projects that don't want these files get a
# one-time creation on first weekly cron; `_skip_if_exists` preserves
# thereafter.
_skip_if_exists:
  # .claude/skills/ (the contributor-facing authoring skill) is deliberately
  # NOT listed here: it follows the CLAUDE.md ownership pattern — template-
  # owned, re-rendered on every update, with a DOMAIN-AUTHORING sentinel
  # block for project-specific additions — so contribution-hygiene fixes
  # reach existing consumers instead of freezing at first render.  Contrast
  # with `.claude-plugin/**` below, whose skills are USER-facing content.
  # NOTE: .gitignore (seeded once, below) gained the `.claude/*` +
  # `!.claude/skills/` pattern together with this skill; a consumer whose
  # .gitignore predates it must apply that change by hand, or the rendered
  # skill stays untracked (git add skips ignored paths).
  # Claude Code plugin channel starters: seeded once, then project-owned.
  # plugin.json / .mcp.json carry the live release version (stamped by
  # scripts/stamp_manifests.py inside each stable release PR), so
  # re-rendering them on update would reset the version to the 0.0.0 seed;
  # env wiring and skills are domain content.
  - ".claude-plugin/**"
  - "src/{{python_module}}/tools.py"
  - "src/{{python_module}}/resources.py"
  - "src/{{python_module}}/prompts.py"
  - "src/{{python_module}}/domain.py"
  - "tests/conftest.py"
  - "tests/test_smoke.py"
  - "tests/test_cli.py"
  # Public import-surface snapshot (#352) — the domain-owned expected-names
  # list consumed by the template-owned tests/test_import_surface.py, same
  # split as conftest.py's config_contract_env seam.  Seeded with the
  # scaffold's empty surface (the skeleton root exports only `__version__`,
  # a dunder); each project's real surface is domain content, so
  # re-rendering on update would wipe it back to empty and turn the guard
  # red on every downstream.  Regenerate via
  # `uv run python tests/test_import_surface.py --update`.
  - "tests/public_import_surface.txt"
  # Seeded once, then release-tool-owned: knope writes each release's
  # version section into the release PR beneath the seed's
  # `<!-- version list -->` insertion flag, so re-rendering on update would
  # clobber a project's accumulated release history — the seed must stay
  # skip-listed.  Migration for projects whose CHANGELOG.md predates the
  # flag (template#350): add the flag line once, by hand — the re-rendered
  # tests/test_release_flow_contract.py fails loudly (naming the line)
  # until it is present.  Projects adopted from the PSR era also normalize
  # their headings once (`## vX.Y.Z` → `## X.Y.Z`) — see the template
  # repo's UPGRADING.md.
  - "CHANGELOG.md"
  # Release-notes surface (template#347): the index landing page is seeded
  # once and thereafter owned by the notes pipeline (the generator inserts a
  # list entry per minor between its markers) and by humans editing merged
  # pages.  The per-minor pages themselves only ever exist downstream, but
  # the glob keeps a future template-side releases/* file from clobbering a
  # project's accumulated release history — same rationale as CHANGELOG.md
  # directly above.
  - "docs/releases/**"
  - "LICENSE"
  # .env.example is listed further down, with the other generated config
  # artifacts — see the "Generated AND skip-listed" note below.
  - "packaging/mcpb/manifest.json.in"
  - "packaging/mcpb/pyproject.toml.in"
  - "packaging/mcpb/src/server.py"
  - "packaging/mcpb/build.sh"
  - ".gitignore"
  # scripts/stamp_manifests.py is deliberately NOT here: it is
  # template-owned with DOMAIN-MANIFESTS-HELPERS / DOMAIN-MANIFESTS seams
  # for a project's extra versioned manifests, the same hybrid pattern as
  # .pre-commit-config.yaml below.  The precedent is its PSR-era
  # predecessor, scripts/bump_manifests.py (deleted in the knope swap):
  # while THAT script was seeded, it was coupled to a file that DOES
  # re-render — `pyproject.toml`'s `[tool.semantic_release] assets` — so
  # half of a fix could land: v3.1.0 (#298) added `uv.lock` to `assets`
  # *and* a `_bump_lockfile()` to the script, and every instance with a
  # pre-existing extended copy took the assets half only, shipping release
  # commits whose lockfile self-version lagged `pyproject.toml` (#325,
  # #326).  Template-ownership plus the seams is what closed that class;
  # today the stamp script's invocation partner is knope.toml, and
  # tests/test_release_flow_contract.py asserts the coupling.
  # .pre-commit-config.yaml is deliberately NOT here (moved out for #254):
  # it is template-owned with a DOMAIN-HOOKS seam for domain-specific hooks
  # (shellcheck, yamllint, project linters, etc.), the same hybrid pattern
  # as CLAUDE.md/README.md below.  While it was seeded, the re-rendered
  # tests/test_structural_gate.py asserted on a file `copier update` could
  # never reach, so every pre-existing consumer's structural select string
  # eventually drifted and turned those tests red.
  # Vale config — users tune rule overrides, add Vocab, pin Packages
  # versions per their docs corpus.  Initial render seeds the file; later
  # template updates leave their tuning intact.
  - ".vale.ini"
  # Vale Vocab accept list — the activation vehicle for `Vocab = Base` in
  # .vale.ini above.  Users add project-specific accepted terms as their
  # docs corpus grows; without _skip_if_exists, copier update would wipe
  # those additions on every weekly cron and reseed the template version.
  - ".vale/styles/config/vocabularies/Base/accept.txt"
  # docs/javascripts/config-wizard/wizard-spec.json is listed further down,
  # with the other generated config artifacts — see the "Generated AND
  # skip-listed" note below (the wizard *runtime* — generators.js, wizard.js,
  # config-wizard.css, wizard-spec-schema.json — stays template-owned and
  # overwritten on update, same as before).
  #
  # Domain presentation config — declares only the vars
  # scripts/gen_config_surface.py's AST scan of ProjectConfig cannot see
  # (deprecated aliases no longer read inside ProjectConfig.from_env, or vars
  # read outside it entirely).  Preserved across copier update; the template
  # ships an empty seed on first render.
  - "config-presentation.domain.yml"
  # Domain-specific wizard browser tests — seeded with one skipped placeholder,
  # owned downstream.  Generic framework tests stay in
  # test_config_wizard_smoke.py (template-owned).
  - "tests/test_config_wizard_domain.py"
  # MCP Apps SPA source — domain-owned (the project's UI). vendor_spa.py
  # regenerates app.html from it on every copier update; app.html itself is
  # generated, never template-owned.
  - "src/{{ python_module }}/static/app.src.html"
  # Fully-generated config artifacts — regenerated on every `copier copy`
  # (the `_tasks` entry above) and at the END of every `copier update` (the
  # `_migrations` entry above).  They are listed here NOT for the usual
  # "domain-owned, frozen at first render" reason (they are neither):
  # `_skip_if_exists` doubles as copier's never-patch-on-update list, and
  # that is the contract a generator-owned file needs.  `copier update`
  # applies the old-render → project diff on top of the fresh render, so a
  # patch landing on one of these files can only corrupt the freshly
  # generated content — for every consumer whose seeded copy predates the
  # template version being left behind, the update used to revert the
  # generator's output and leave inline conflict markers (#282).
  # Skip-listing removes these paths from patch application; the
  # after-migration's rewrite (which runs once the diff has restored the
  # project's config.py, so domain discovery sees the real fields) is what
  # keeps them current instead.
  - ".env.example"
  - "packaging/env.example"
  - "examples/*.env"
  - "docs/javascripts/config-wizard/wizard-spec.json"
#
# Generated AND skip-listed: `.env.example`, `packaging/env.example`,
# `examples/*.env`, and `docs/javascripts/config-wizard/wizard-spec.json`
# used to live in `_skip_if_exists` as domain-owned files (frozen at first
# render). Since #264 they are generated instead; since #330
# `packaging/mcpb/manifest.json.in` joins them — its `user_config` and
# `server.mcp_config.env` objects are regenerated from the config surface
# (curated via `files:` in the presentation layer), while the rest of the
# manifest stays seeded and hand-editable. All are generated — on every `copier copy`
# (`_tasks`) and at the end of every `copier update` (`_migrations`), from
# `fastmcp_pvl_core.server_config_surface()` plus `config-presentation.yml` /
# `config-presentation.domain.yml` — and they stay listed above only for the
# update-patch mechanics explained inline. Regeneration is unconditional: any
# local edit to these files is overwritten the next time the task runs, and
# CI's `scripts/gen_config_surface.py --check` step (ci.yml) fails the build
# if a committed copy has drifted from what the generator would produce.
# Downstream customisation of the config surface therefore does NOT belong in
# these files — it belongs in `config.py`'s `CONFIG-FIELDS` field
# `metadata={"help": ..., "tags": (...)}` (for a var read through
# `ProjectConfig.from_env`) or in `config-presentation.domain.yml` (for a var
# the AST scan cannot see: a deprecated alias no longer read inside
# `from_env`, or a var read outside `from_env` entirely).
# Note: CLAUDE.md and README.md are deliberately NOT in _skip_if_exists.
# Both are hybrid files: domain-owned sections are bracketed by
# <!-- DOMAIN-START --> / <!-- DOMAIN-END --> markers, and the rest is
# template-owned.  Copier's plain 3-way merge (old-rendered vs new-rendered
# vs current) does the actual work: because DOMAIN-block contents are
# stable across renders, downstream edits inside them survive the merge;
# template-owned text diverges between old-rendered and new-rendered so
# those changes get re-applied.  The DOMAIN markers and the
# ===== TEMPLATE-OWNED ===== banner comments are a human/agent convention
# — copier itself doesn't act on them.  README.md was moved out of
# _skip_if_exists in #57.  The same hybrid pattern applies to
# docs/*.md.jinja files: docs/deployment/* and docs/guides/authentication.md
# moved out in #29 (PR #108); docs/guides/authorization.md (the
# enable_authorization-gated guide, DOMAIN-AUTHZ-SCOPES/EXTRA sentinels)
# added in #178; the remaining top-level docs/*.md files
# (index, installation, configuration, tools/index, prompts) moved out in #106.
# Those docs files use topic-specific DOMAIN-{TOPIC}-{KIND} sentinels
# rather than the bare DOMAIN-START used in CLAUDE.md / README.md.
# .pre-commit-config.yaml joined the hybrid set for #254 (its seam is
# DOMAIN-HOOKS, YAML-comment markers): downstream hooks live between the
# markers and survive the merge; the template-owned hook pins and gate
# wiring re-render in lockstep with the tests that assert on them.
# scripts/stamp_manifests.py carries the same hybrid pattern (seams:
# DOMAIN-MANIFESTS-HELPERS, DOMAIN-MANIFESTS, Python-comment markers — first
# introduced on its PSR-era predecessor for #325), with knope.toml's stamp
# Command as the invocation it must stay in lockstep with;
# tests/test_release_flow_contract.py asserts that coupling.

# Files in the template repo that should never land in generated projects.
# Setting _exclude in copier.yml REPLACES copier's default exclude list
# entirely — so we re-list the stock defaults (.git, __pycache__, ~*, etc.)
# here as well.
#
# Named README.md/CHANGELOG.md/LICENSE/CLAUDE.md files also exist in this
# repo as maintainer-facing documentation; copier's `.jinja` precedence
# means README.md.jinja / CLAUDE.md.jinja / CHANGELOG.md.jinja / LICENSE.jinja
# render into the destination, and the plain files stay only in the template
# repo.  They don't need to be listed here for that to work.
_exclude:
  # Copier's default excludes (lost when we set _exclude explicitly):
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Template-repo-specific excludes:
  - "tests/fixtures"
  - ".github/workflows/template-ci.yml"       # self-test — template-repo only
  - ".github/workflows/template-release.yml"  # template's own release — template-repo only
  - ".github/renovate.json"                    # upstream detector config — template-repo only
  - ".github/workflows/template-renovate.yml"  # upstream Renovate runner — template-repo only
  - ".github/workflows/template-labels.yml"  # this repo's label-ensure — template-repo only
  - "docs/superpowers"
  - "UPGRADING.md"                             # template-consumer upgrade notes — template-repo only
  - "uv.lock"                                 # generated projects create their own
  - "scripts/tests"                            # aggregator unit tests — template-only
  - "scripts/check_render_hygiene.py"          # template-ci render guard — template-only
  - "scripts/check_update_regression.py"       # template-ci update guard — template-only
  - "schemas"                                  # vendored server.json schema — template-ci gate only
  # Scaffold files that projects routinely have their own version of
  # (different docs layout, different test organisation).  Excluding
  # them here means they never render on copy OR update — fresh
  # projects bring their own docs and tests; retrofitted projects don't
  # get spurious re-creations every week.  The `.jinja` files stay in
  # this repo as maintainer-facing reference content.
  - "tests/test_tools.py"
  - "docs/design/index.md"

# --- Variables ---

project_name:
  type: str
  help: "Repo name, CLI command, Docker image basename (e.g. markdown-vault-mcp)"
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Lowercase letters, digits, and hyphens only; must start with a letter.
    {% endif %}

pypi_name:
  type: str
  default: "{{ project_name }}"
  help: "PyPI distribution name (override when it differs from project_name)"

python_module:
  type: str
  default: "{{ pypi_name | replace('-', '_') }}"
  help: "Python import name (underscore-separated)"
  validator: >-
    {% if not (python_module | regex_search('^[a-z][a-z0-9_]*$')) %}
    Lowercase letters, digits, and underscores only; must start with a letter.
    {% endif %}

env_prefix:
  type: str
  help: "Env var prefix, no trailing underscore (e.g. MARKDOWN_VAULT_MCP)"
  validator: >-
    {% if not (env_prefix | regex_search('^[A-Z][A-Z0-9_]*[A-Z0-9]$')) %}
    Uppercase letters, digits, and underscores only; must start and end with letter/digit.
    {% endif %}

human_name:
  type: str
  help: "Human-readable project name for docs (e.g. 'Markdown Vault MCP')"

domain_description:
  type: str
  help: "One-line blurb for README and the default MCP instructions"

github_org:
  type: str
  default: "pvliesdonk"
  help: "Used for URLs, Docker registry path, and GitHub references"

docker_registry:
  type: str
  default: "ghcr.io/{{ github_org }}"
  help: "Docker registry (override for docker.io or a private registry)"

include_mcp_apps_scaffold:
  type: bool
  default: false
  help: "Include MCP Apps SPA scaffold (hash-routed app-only tools, inline HTML placeholder); leave off for projects without a visual UI"

include_claude_plugin:
  type: bool
  default: false
  help: "Scaffold the Claude Code plugin channel (.claude-plugin/plugin: plugin.json + exec-form .mcp.json seeded once, version-stamped by scripts/stamp_manifests.py in every stable release PR). The release workflow's marketplace publish job already keys on the directory existing at the tag, so turning this on is what makes marketplace publishing take effect. Leave off for servers not distributed as a Claude Code plugin."

enable_authorization:
  type: bool
  default: false
  help: "Scaffold the opt-in per-subject authorization surface: the commented ACL middleware stubs in config.py/server.py, the brief README 'Authorization' pointer, the docs/guides/authorization.md guide and its nav entry, the *_ACL_PATH line in .env.example, and the cross-link in the authentication guide. Leave off unless this server needs per-caller scope gating (runtime enablement is still via the *_ACL_PATH env var)."

enable_structural_gate:
  type: bool
  default: true
  help: "Scaffold the diff-scoped structural-health gate: strict ruff structural rules (complexity, god-class, too-many-*, security) enforced on changed lines only via diff-quality, as a pre-push hook and a CI 'structure' job, plus the CLAUDE.md structural-health guidance (local-shape rules, advisory radon/vulture audit, decay-issue template). New code is held to the bar; pre-existing code is never blocked. Leave on unless a project deliberately opts out of structural enforcement."

structural_gate_assert_clean_tree:
  type: bool
  default: true
  when: "{{ enable_structural_gate }}"
  help: "Also assert the project's EXISTING src/ + tests/ tree is already clean under the structural overlay (the test_shipped_code_passes_the_structural_overlay_cleanly check). True is correct for new projects and the template's own CI. Set to false when ADOPTING the gate onto a brownfield codebase that already carries structural debt: you still get the diff-scoped gate, pre-push hook, CI 'structure' job, and the behavioural tests — only the whole-tree clean assertion is dropped, so enabling the gate does not force refactoring or blanket-noqa of all legacy debt first (the diff-scoped gate still grandfathers it and blocks new debt). Only asked when the structural gate is on."
